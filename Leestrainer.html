<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Leestrainer</title>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card: #FFFFFF;
            --text: #1F2937;
            --highlight: #FEF08A;
            --error: #EF4444;
            --success: #10B981;
        }

        * { -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
            position: relative;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #F3F4F6;
            padding-bottom: 10px;
        }

        .header-bar h1 { font-size: 1.5rem; margin: 0; color: var(--primary); }

        .btn-home {
            background-color: #F3F4F6; color: #4B5563; border: 1px solid #D1D5DB;
            padding: 6px 12px; border-radius: 10px; font-size: 0.9rem; font-weight: bold; cursor: pointer;
        }

        .step-panel { display: none; }
        .step-panel.active { display: block; }

        .btn {
            display: block; width: 100%; padding: 14px; margin: 10px 0;
            background-color: var(--primary); color: white; border: none;
            border-radius: 12px; font-size: 1.1rem; font-weight: 600; text-align: center; cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.1s ease;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-secondary { background-color: #6B7280; }
        .btn-outline { background-color: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-manual { background-color: var(--success); }

        input[type="file"] { display: none; }

        .zoom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            background: #EEF2FF;
            padding: 8px 12px;
            border-radius: 12px;
        }

        .zoom-btn {
            background: #FFFFFF; border: 1px solid #CBD5E1; padding: 6px 10px;
            border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; color: var(--primary);
        }

        .btn-undo-top {
            background: #FEE2E2; color: #DC2626; border: 1px solid #FCA5A5;
            padding: 6px 10px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; cursor: pointer;
        }

        .btn-process-top {
            background: var(--success); color: white; border: none;
            padding: 6px 10px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; cursor: pointer;
        }

        .anker-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .btn-anker {
            background-color: #EEF2FF;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 12px 0;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn-anker:active {
            background-color: var(--primary);
            color: white;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-height: 55vh;
            margin: 10px 0;
            background: #0F172A;
            border-radius: 12px;
            overflow: scroll;
            -webkit-overflow-scrolling: touch;
            border: 2px solid #CBD5E1;
            scrollbar-width: auto;
            scrollbar-color: #4F46E5 #E2E8F0;
        }

        .canvas-container::-webkit-scrollbar { width: 12px; height: 12px; }
        .canvas-container::-webkit-scrollbar-track { background: #E2E8F0; border-radius: 6px; }
        .canvas-container::-webkit-scrollbar-thumb { background-color: var(--primary); border-radius: 6px; border: 2px solid #E2E8F0; }

        canvas { display: block; cursor: crosshair; touch-action: none; }

        textarea {
            width: 100%; height: 140px; border: 1px solid #D1D5DB;
            border-radius: 10px; padding: 10px; box-sizing: border-box; font-size: 1.2rem; margin-bottom: 10px;
        }

        .method-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 12px 5px; font-size: 1.1rem; border: 2px solid #D1D5DB;
            background: #F9FAFB; border-radius: 10px; font-weight: bold; cursor: pointer; text-align: center; color: #4B5563;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .speed-control {
            background: #EEF2FF; padding: 12px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
        }
        .speed-slider { flex: 1; height: 8px; border-radius: 5px; outline: none; accent-color: var(--primary); }

        .full-list-card {
            position: relative;
            background-color: #F9FAFB; border: 2px dashed #CBD5E1; border-radius: 16px;
            padding: 20px; margin: 15px 0; display: flex; flex-direction: column; gap: 12px; align-items: center;
            min-height: 150px; overflow: hidden;
        }

        .countdown-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.94);
            display: flex; justify-content: center; align-items: flex-start;
            padding-top: 25px; font-size: 6rem; font-weight: 900; color: var(--primary);
            z-index: 20; border-radius: 16px;
            animation: pulseCount 0.7s infinite alternate ease-in-out;
        }

        @keyframes pulseCount {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        .word-badge {
            background: #FFFFFF; border: 1px solid #CBD5E1; padding: 12px 20px; border-radius: 12px;
            font-size: 1.4rem; font-weight: 600; color: #334155; transition: all 0.2s ease; width: 85%; text-align: center; box-sizing: border-box;
            scroll-margin: 60px; /* Zorgt voor een fijne marge bij het automatisch scrollen */
        }
        .word-badge.active-word {
            background-color: var(--highlight); border-color: #EAB308; transform: scale(1.05); color: #854D0E;
        }

        .single-word-card {
            background-color: #EEF2FF; border: 3px solid var(--primary); border-radius: 16px;
            padding: 25px; text-align: center; font-size: 2.8rem; font-weight: bold; margin: 10px 0; color: #312E81;
        }

        .picto-feedback {
            text-align: center; font-size: 1.2rem; font-weight: bold; min-height: 45px; margin-top: 10px; color: var(--primary);
        }
        .picto-feedback.error-msg { color: var(--error); }

        .loader { text-align: center; display: none; margin: 15px 0; font-weight: bold; color: var(--primary); }
        .loader-bar-track { width: 100%; height: 10px; background: #E5E7EB; border-radius: 6px; margin-top: 10px; overflow: hidden; }
        .loader-bar-fill { height: 100%; width: 0%; background: var(--primary); border-radius: 6px; transition: width 0.2s ease; }

        .nav-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; }

        .score-card {
            display: none; margin: 15px 0; font-size: 1.3rem; font-weight: bold;
            color: var(--primary); background: #EEF2FF; padding: 15px;
            border-radius: 12px; border: 2px solid var(--primary); text-align: center;
        }

        .info-banner {
            display: none; background: #FEF3C7; border: 1px solid #FBBF24; color: #92400E;
            padding: 10px 12px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 10px; text-align: center;
        }

        .anim-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999;
            display: flex; justify-content: center; align-items: center;
        }
        .thumbs-up-anim { font-size: 7rem; animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes bounceIn { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        button:focus-visible, .btn-anker:focus-visible, label:focus-visible {
            outline: 3px solid #312E81; outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            .shake, .thumbs-up-anim, .countdown-overlay { animation: none !important; }
        }
    </style>
</head>
<body>

<div id="anim-container" class="anim-overlay" aria-hidden="true"></div>

<div class="container">
    <div class="header-bar">
        <h1>📖 Leestrainer</h1>
        <button class="btn-home" onclick="resetApp()" aria-label="Terug naar start">🏠 Home</button>
    </div>

    <!-- STAP 1: KEUZE FOTO OF ANKER -->
    <div id="step-upload" class="step-panel active">
        <div id="cdn-warning" class="info-banner" role="alert"></div>

        <label for="camera-input" class="btn">📸 Foto maken</label>
        <input type="file" id="camera-input" accept="image/*" capture="environment" aria-label="Maak een foto van een woordrijtje">

        <div style="margin-top: 20px; border-top: 2px solid #F3F4F6; padding-top: 15px;">
            <p style="font-weight: bold; text-align: center; margin-bottom: 10px; color: #4B5563;">
                📚 Of kies een Anker:
            </p>
            <div class="anker-grid">
                <button class="btn-anker" onclick="loadAnker(1)" aria-label="Ankerlijst 1">1</button>
                <button class="btn-anker" onclick="loadAnker(2)" aria-label="Ankerlijst 2">2</button>
                <button class="btn-anker" onclick="loadAnker(3)" aria-label="Ankerlijst 3">3</button>
                <button class="btn-anker" onclick="loadAnker(4)" aria-label="Ankerlijst 4">4</button>
                <button class="btn-anker" onclick="loadAnker(5)" aria-label="Ankerlijst 5">5</button>
            </div>
        </div>

        <div id="draw-controls" style="display:none; margin-top: 15px;">
            <div class="zoom-bar">
                <div style="display: flex; align-items: center; gap: 4px;">
                    <span style="font-size: 0.85rem; font-weight: bold;">🔍 Zoom:</span>
                    <button class="zoom-btn" onclick="adjustZoom(0.3)" aria-label="Inzoomen">➕</button>
                    <button class="zoom-btn" onclick="adjustZoom(-0.3)" aria-label="Uitzoomen">➖</button>
                    <button class="zoom-btn" onclick="resetZoom()" aria-label="Zoom herstellen">🔄</button>
                </div>
                <div style="display: flex; gap: 6px;">
                    <button id="undo-box-btn" class="btn-undo-top">↩️ Wissen</button>
                    <button id="process-boxes-btn" class="btn-process-top">✂️ Herken tekst</button>
                </div>
            </div>

            <div class="canvas-container" id="canvas-container">
                <canvas id="image-canvas"></canvas>
            </div>

            <p style="text-align:center; font-size: 0.85rem; color: #4B5563; margin: 8px 0;">
                👉 Trek een kader om een woordrijtje te selecteren.<br>
                👉 Gebruik twee vingers om de foto te verschuiven.
            </p>
        </div>

        <div id="ocr-loader" class="loader">
            <div id="ocr-loader-text">⏳ Tekst wordt herkend...</div>
            <div class="loader-bar-track"><div id="ocr-loader-fill" class="loader-bar-fill"></div></div>
        </div>
    </div>

    <!-- STAP 2: CONTROLEER WOORDEN -->
    <div id="step-review" class="step-panel">
        <p><strong>Herkende / Geselecteerde woorden:</strong></p>
        <textarea id="words-input" placeholder="Elk woord op een nieuwe regel..." aria-label="Woordenlijst, één woord per regel"></textarea>
        <button id="start-practice-btn" class="btn">🚀 Start Leesoefening</button>
    </div>

    <!-- STAP 3: OEFENEN -->
    <div id="step-practice" class="step-panel">
        <div class="method-tabs">
            <button class="tab-btn active" id="tab-1" onclick="setMode(1)">VOOR</button>
            <button class="tab-btn" id="tab-2" onclick="setMode(2)">KOOR</button>
            <button class="tab-btn" id="tab-3" onclick="setMode(3)">DOOR</button>
        </div>

        <div class="speed-control" id="speed-control-box">
            <span class="speed-icon" aria-hidden="true">🐢</span>
            <input type="range" id="speed-slider" class="speed-slider" min="0.1" max="0.8" step="0.05" value="0.35" aria-label="Voorleessnelheid">
            <span class="speed-icon" aria-hidden="true">🐇</span>
        </div>

        <div id="full-list-view">
            <button id="play-list-btn" class="btn" onclick="handleFullListAction()">🔊 Beluister het rijtje</button>
            <div class="full-list-card" id="full-list-container"></div>
        </div>

        <div id="single-word-view" style="display:none;">
            <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #666; margin-bottom: 5px;">
                <span id="progress-text">Woord 1 van 5</span>
            </div>

            <div class="single-word-card" id="target-word">...</div>

            <div id="speech-warning" class="info-banner"></div>

            <button id="speak-btn" class="btn" onclick="startListening()">🎤 Druk om te starten</button>
            <button id="manual-confirm-btn" class="btn btn-manual" style="display:none;" onclick="manualConfirmWord()">✅ Ik heb het woord gezegd</button>

            <div class="nav-buttons">
                <button class="btn btn-outline" style="margin:0;" onclick="prevWord()">⬅️ Vorige</button>
                <button class="btn btn-outline" style="margin:0;" onclick="nextWord()">Volgende ➡️</button>
            </div>
        </div>

        <div id="picto-feedback" class="picto-feedback" role="status" aria-live="polite"></div>
    </div>

    <!-- STAP 4: AFGEROND & SCORE -->
    <div id="step-finished" class="step-panel">
        <div style="text-align: center; padding: 20px 10px;">
            <div style="font-size: 5rem;">🏆🌟🎉</div>
            <h2 style="color: var(--primary); margin-bottom: 5px;">Super gedaan!</h2>

            <div id="score-display" class="score-card"></div>

            <button class="btn" onclick="setMode(1); switchStep('step-practice');">🔄 Nog eens oefenen</button>
            <button class="btn btn-secondary" onclick="resetApp()">🏠 Terug naar menu</button>
        </div>
    </div>
</div>

<script>
    /* ANKER WOORDENLIJSTEN */
    const ANKERS = {
        1: ["en","een","in","is","ik","maar","er","voor","ben","aan","naar","ook","meer","mee","men","keek","maak","keer","paar","vaak","nee","neem","naam","ver","eer","ken","boom","neer","raam","boos","maan","oom","baas","been","vis","oor","koop","raak","mis","nek","raar","min","baan","koos","meen","rook","mes","beer","kip","kaas","aap","bek","neen","ren","kin","roos","poos","pen","koor","vee"],
        2: ["en","een","het","van","in","is","hij","zijn","dat","ik","met","maar","er","voor","zij","ben","aan","naar","haar","ook","dan","bij","door","hem","kan","mijn","dit","hun","toen","daar","meer","moet","kun","hoe","mij","doen","mee","man","men","dus","keek","toe","doet","doe","zit","zat","net","maak","hen","keer","paar","kijk","vaak","heen","nam","nee","hoor","neem","naam","ver"],
        3: ["en","een","het","van","in","is","hij","zijn","dat","ik","op","was","die","niet","met","maar","er","voor","zij","ben","aan","naar","wees","haar","ook","om","dan","wat","bij","door","hem","uit","wel","kan","mijn","dit","hun","kon","al","toen","daar","tot","meer","weer","zal","moet","veel","kun","hoe","mij","heel","waar","zul","zien","hier","wil","doen","kom","jaar","mee"],
        4: ["de","en","een","het","van","in","is","hij","te","zijn","dat","ik","op","ze","was","die","je","niet","met","maar","er","voor","zij","ben","aan","naar","wees","haar","ook","om","dan","wat","of","nog","bij","door","hem","zich","uit","zei","wel","zou","we","kan","mijn","dit","hun","geen","kon","al","toen","daar","tot","meer","weer","zal","gaan","moet","veel","ging"],
        5: ["de","en","een","het","van","in","is","hij","te","zijn","dat","ik","op","ze","was","die","je","niet","met","maar","er","voor","als","zij","ben","aan","bent","naar","had","wees","haar","ook","heeft","om","dan","heb","wat","of","nog","bij","door","hem","werd","zich","uit","zei","wel","zou","we","kan","mijn","dit","hun","geen","kon","al","toen","daar","word","tot"]
    };

    let loadedImage = null;
    let canvas = document.getElementById('image-canvas');
    let ctx = canvas.getContext('2d');

    let boxes = [];
    let isDrawing = false;
    let dragState = null;
    let startX, startY, currentX, currentY;
    let zoomLevel = 1.0;

    let isPanning = false;
    let panLastMid = null;

    const HANDLE_RADIUS = 22;

    let wordList = [];
    let currentIndex = 0;
    let currentMode = 1;
    let recognition = null;
    let speechRecognitionSupported = false;
    let isPlayingList = false;
    let isProcessingSpeech = false;
    let hasMatchedInSession = false;
    let hasReceivedSpeech = false;
    let recognitionRestartAttempts = 0;

    let isAutoListening = false;
    let currentWordErrorCount = 0;

    let correctCount = 0;
    let currentWordFailed = false;
    let currentStepId = 'step-upload';

    /* SCREEN WAKE LOCK (Voorkom dat het scherm dimt of uitvalt) */
    let wakeLock = null;

    async function requestWakeLock() {
        if ('wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {
                console.log('Wake Lock mislukt:', err);
            }
        }
    }

    function releaseWakeLock() {
        if (wakeLock !== null) {
            wakeLock.release().catch(() => {}).then(() => { wakeLock = null; });
        }
    }

    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await requestWakeLock();
        }
    });

    const cameraInput = document.getElementById('camera-input');
    const canvasContainer = document.getElementById('canvas-container');
    const drawControls = document.getElementById('draw-controls');
    const ocrLoader = document.getElementById('ocr-loader');
    const ocrLoaderText = document.getElementById('ocr-loader-text');
    const ocrLoaderFill = document.getElementById('ocr-loader-fill');
    const wordsInput = document.getElementById('words-input');
    const cdnWarning = document.getElementById('cdn-warning');

    function checkCdnAvailability() {
        const missing = [];
        if (typeof Tesseract === 'undefined') missing.push('tekstherkenning');
        if (typeof confetti === 'undefined') missing.push('animaties');
        if (missing.length > 0) {
            cdnWarning.style.display = 'block';
            cdnWarning.innerText = `⚠️ Kon onderdelen voor ${missing.join(' en ')} niet laden. Controleer je internetverbinding en herlaad de pagina. De ankerlijsten werken wel gewoon.`;
        }
    }
    checkCdnAvailability();

    function safeConfetti(options) {
        if (typeof confetti === 'function') {
            try { confetti(options); } catch (e) {}
        }
    }

    let cachedVoice = null;
    let voicesLoaded = false;

    function pickBestVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) return null;
        voicesLoaded = true;

        let voice = voices.find(v => v.lang === 'nl-BE' || v.lang.includes('BE') ||
            (v.lang.toLowerCase().includes('nl') && (v.name.toLowerCase().includes('belgium') || v.name.toLowerCase().includes('flemish') || v.name.toLowerCase().includes('ellen'))));

        if (!voice) voice = voices.find(v => v.lang.toLowerCase().startsWith('nl'));

        return voice || null;
    }

    function speakText(text, onEndCallback = null) {
        if (!('speechSynthesis' in window)) {
            if (onEndCallback) onEndCallback();
            return;
        }
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = parseFloat(document.getElementById('speed-slider').value);
        utterance.lang = 'nl-BE';

        if (!cachedVoice) cachedVoice = pickBestVoice();
        if (cachedVoice) utterance.voice = cachedVoice;

        const fallbackTimer = setTimeout(() => { if (onEndCallback) onEndCallback(); }, Math.max(1500, text.length * 350));
        utterance.onend = () => { clearTimeout(fallbackTimer); if (onEndCallback) onEndCallback(); };
        utterance.onerror = () => { clearTimeout(fallbackTimer); if (onEndCallback) onEndCallback(); };

        window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => { cachedVoice = pickBestVoice(); };
        setTimeout(() => { if (!voicesLoaded) cachedVoice = pickBestVoice(); }, 300);
    }

    function loadAnker(num) {
        const list = ANKERS[num];
        if (!list) return;

        const shuffled = [...list].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 10);

        wordsInput.value = selected.join('\n');
        switchStep('step-review');
    }

    cameraInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            loadedImage = new Image();
            loadedImage.onload = () => {
                zoomLevel = 1.0;
                setupCanvas();
                canvasContainer.style.display = 'block';
                drawControls.style.display = 'block';
            };
            loadedImage.onerror = () => {
                alert('Deze foto kon niet geladen worden. Probeer het opnieuw.');
            };
            loadedImage.src = event.target.result;
        };
        reader.onerror = () => alert('De foto kon niet gelezen worden. Probeer het opnieuw.');
        reader.readAsDataURL(file);
    });

    function setupCanvas() {
        boxes = [];
        const containerWidth = canvasContainer.clientWidth || 440;
        const baseScale = containerWidth / loadedImage.width;

        canvas.width = containerWidth;
        canvas.height = loadedImage.height * baseScale;

        applyZoomStyle();
        redrawCanvas();
    }

    function adjustZoom(delta) {
        zoomLevel = Math.max(1.0, Math.min(3.0, zoomLevel + delta));
        applyZoomStyle();
    }

    function resetZoom() {
        zoomLevel = 1.0;
        applyZoomStyle();
    }

    function applyZoomStyle() {
        const containerWidth = canvasContainer.clientWidth || 440;
        const baseHeight = (loadedImage.height * (containerWidth / loadedImage.width));

        canvas.style.width = (containerWidth * zoomLevel) + 'px';
        canvas.style.height = (baseHeight * zoomLevel) + 'px';
    }

    function redrawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);

        boxes.forEach((box, index) => {
            ctx.strokeStyle = '#4F46E5';
            ctx.lineWidth = 3;
            ctx.strokeRect(box.x, box.y, box.w, box.h);
            ctx.fillStyle = 'rgba(79, 70, 229, 0.15)';
            ctx.fillRect(box.x, box.y, box.w, box.h);

            ctx.fillStyle = '#4F46E5';
            ctx.fillRect(box.x, box.y, 26, 26);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 15px sans-serif';
            ctx.fillText((index + 1).toString(), box.x + 8, box.y + 18);

            drawHandles(box);
        });

        if (isDrawing) {
            ctx.strokeStyle = '#10B981';
            ctx.lineWidth = 2;
            ctx.strokeRect(startX, startY, currentX - startX, currentY - startY);
        }
    }

    function drawHandles(box) {
        const { x, y, w, h } = box;
        const handles = [
            { x: x, y: y }, { x: x + w / 2, y: y }, { x: x + w, y: y },
            { x: x + w, y: y + h / 2 }, { x: x + w, y: y + h },
            { x: x + w / 2, y: y + h }, { x: x, y: y + h }, { x: x, y: y + h / 2 }
        ];

        handles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 9, 0, 2 * Math.PI);
            ctx.fillStyle = '#FFFFFF';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#4F46E5';
            ctx.stroke();
        });
    }

    function getHandleAt(pos) {
        for (let i = boxes.length - 1; i >= 0; i--) {
            const b = boxes[i];
            const { x, y, w, h } = b;
            const handles = [
                { name: 'nw', x: x, y: y }, { name: 'ne', x: x + w, y: y },
                { name: 'sw', x: x, y: y + h }, { name: 'se', x: x + w, y: y + h },
                { name: 'n',  x: x + w / 2, y: y }, { name: 's',  x: x + w / 2, y: y + h },
                { name: 'w',  x: x, y: y + h / 2 }, { name: 'e',  x: x + w, y: y + h / 2 }
            ];

            for (let hnd of handles) {
                if (Math.hypot(pos.x - hnd.x, pos.y - hnd.y) <= HANDLE_RADIUS) {
                    return { boxIndex: i, handle: hnd.name };
                }
            }
            if (pos.x >= x && pos.x <= x + w && pos.y >= y && pos.y <= y + h) {
                return { boxIndex: i, handle: 'move' };
            }
        }
        return null;
    }

    function getCanvasCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function getTouchMidpoint(touches) {
        return {
            x: (touches[0].clientX + touches[1].clientX) / 2,
            y: (touches[0].clientY + touches[1].clientY) / 2
        };
    }

    function handleStart(e) {
        const pos = getCanvasCoordinates(e);
        const hit = getHandleAt(pos);

        if (hit) {
            dragState = { boxIndex: hit.boxIndex, handle: hit.handle, startPos: pos, initialBox: { ...boxes[hit.boxIndex] } };
        } else {
            isDrawing = true;
            startX = pos.x; startY = pos.y; currentX = pos.x; currentY = pos.y;
        }
    }

    function handleMove(e) {
        const pos = getCanvasCoordinates(e);
        if (dragState) {
            const dx = pos.x - dragState.startPos.x;
            const dy = pos.y - dragState.startPos.y;
            const b = boxes[dragState.boxIndex];
            const init = dragState.initialBox;

            switch (dragState.handle) {
                case 'nw': b.x = init.x + dx; b.w = init.w - dx; b.y = init.y + dy; b.h = init.h - dy; break;
                case 'ne': b.w = init.w + dx; b.y = init.y + dy; b.h = init.h - dy; break;
                case 'sw': b.x = init.x + dx; b.w = init.w - dx; b.h = init.h + dy; break;
                case 'se': b.w = init.w + dx; b.h = init.h + dy; break;
                case 'n':  b.y = init.y + dy; b.h = init.h - dy; break;
                case 's':  b.h = init.h + dy; break;
                case 'w':  b.x = init.x + dx; b.w = init.w - dx; break;
                case 'e':  b.w = init.w + dx; break;
                case 'move': b.x = init.x + dx; b.y = init.y + dy; break;
            }
            redrawCanvas();
        } else if (isDrawing) {
            currentX = pos.x; currentY = pos.y;
            redrawCanvas();
        }
    }

    function handleEnd() {
        if (dragState) {
            const b = boxes[dragState.boxIndex];
            if (b.w < 0) { b.x += b.w; b.w = Math.abs(b.w); }
            if (b.h < 0) { b.y += b.h; b.h = Math.abs(b.h); }
            dragState = null;
            redrawCanvas();
        } else if (isDrawing) {
            isDrawing = false;
            let w = currentX - startX, h = currentY - startY, x = startX, y = startY;
            if (w < 0) { x = currentX; w = Math.abs(w); }
            if (h < 0) { y = currentY; h = Math.abs(h); }
            if (w > 20 && h > 20) boxes.push({ x, y, w, h });
            redrawCanvas();
        }
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length === 2) {
            isDrawing = false;
            dragState = null;
            isPanning = true;
            panLastMid = getTouchMidpoint(e.touches);
            e.preventDefault();
            return;
        }
        if (e.touches && e.touches.length > 2) return;
        handleStart(e);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        if (isPanning && e.touches && e.touches.length === 2) {
            const mid = getTouchMidpoint(e.touches);
            const dx = mid.x - panLastMid.x;
            const dy = mid.y - panLastMid.y;
            canvasContainer.scrollLeft -= dx;
            canvasContainer.scrollTop -= dy;
            panLastMid = mid;
            e.preventDefault();
            return;
        }
        if (e.touches && e.touches.length > 1) return;
        if (isDrawing || dragState) {
            e.preventDefault();
        }
        handleMove(e);
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
        if (e.touches && e.touches.length < 2) {
            isPanning = false;
            panLastMid = null;
        }
        if (!e.touches || e.touches.length === 0) {
            handleEnd();
        }
    });
    canvas.addEventListener('touchcancel', () => { isPanning = false; panLastMid = null; handleEnd(); });

    document.getElementById('undo-box-btn').addEventListener('click', () => { boxes.pop(); redrawCanvas(); });

    document.getElementById('process-boxes-btn').addEventListener('click', async () => {
        if (boxes.length === 0) return alert("Trek eerst een kader rond een woordrijtje.");

        if (typeof Tesseract === 'undefined') {
            alert("Tekstherkenning kon niet geladen worden. Controleer je internetverbinding en herlaad de pagina.");
            return;
        }

        canvasContainer.style.display = 'none'; drawControls.style.display = 'none'; ocrLoader.style.display = 'block';
        ocrLoaderFill.style.width = '0%';
        ocrLoaderText.innerText = '⏳ Tekst wordt herkend...';

        let allRecognizedWords = [];
        const scaleX = loadedImage.width / canvas.width;
        const scaleY = loadedImage.height / canvas.height;

        for (let i = 0; i < boxes.length; i++) {
            const box = boxes[i];
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = box.w * scaleX; tempCanvas.height = box.h * scaleY;
            tempCtx.drawImage(loadedImage, box.x * scaleX, box.y * scaleY, box.w * scaleX, box.h * scaleY, 0, 0, tempCanvas.width, tempCanvas.height);

            try {
                const result = await Tesseract.recognize(tempCanvas, 'nld', {
                    logger: m => {
                        if (m.status === 'recognizing text' && typeof m.progress === 'number') {
                            const overall = ((i + m.progress) / boxes.length) * 100;
                            ocrLoaderFill.style.width = Math.round(overall) + '%';
                        } else if (m.status) {
                            ocrLoaderText.innerText = `⏳ ${translateOcrStatus(m.status)} (${i + 1}/${boxes.length})`;
                        }
                    }
                });
                result.data.text.split('\n').forEach(line => {
                    let clean = line.replace(/[^a-zA-ZáéíóúäëïöüÅå-]/g, "").trim();
                    if (clean.length > 0) {
                        let formattedWord = /^[A-ZÁÉÍÓÚÄËÏÖÜ][a-záéíóúäëïöü-]+$/.test(clean) ? clean : clean.toLowerCase();
                        allRecognizedWords.push(formattedWord);
                    }
                });
            } catch (err) {
                console.error(err);
                ocrLoaderText.innerText = `⚠️ Kader ${i + 1} kon niet herkend worden, ga verder...`;
            }
        }

        ocrLoader.style.display = 'none';

        if (allRecognizedWords.length === 0) {
            alert("Er werd geen tekst herkend. Probeer een duidelijkere foto of pas de woorden hieronder handmatig aan.");
        }

        wordsInput.value = allRecognizedWords.join('\n');
        switchStep('step-review');
    });

    function translateOcrStatus(status) {
        const map = {
            'loading tesseract core': 'Tekstherkenning laden',
            'initializing tesseract': 'Voorbereiden',
            'loading language traineddata': 'Taalbestand laden',
            'initializing api': 'Klaarzetten',
            'recognizing text': 'Herkennen'
        };
        return map[status] || status;
    }

    /* SPRAAKHERKENNING LOGICA EN AUTO-LISTEN */
    const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognitionClass) {
        try {
            recognition = new SpeechRecognitionClass();
            recognition.lang = 'nl-BE';
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.maxAlternatives = 5;
            speechRecognitionSupported = true;

            recognition.onstart = () => {
                isProcessingSpeech = false;
                hasMatchedInSession = false;
                hasReceivedSpeech = false;
                recognitionRestartAttempts = 0;
                document.getElementById('speak-btn').innerText = "🎙️ Aan het luisteren...";
                showPictoFeedback("👂 Ik luister...", false);
            };

            recognition.onresult = (event) => {
                if (isProcessingSpeech) return;
                hasReceivedSpeech = true;

                const target = wordList[currentIndex].toLowerCase().trim();

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    for (let j = 0; j < event.results[i].length; j++) {
                        const spoken = event.results[i][j].transcript.toLowerCase().trim();

                        if (isFuzzyMatch(spoken, target)) {
                            hasMatchedInSession = true;
                            isProcessingSpeech = true;
                            recognition.stop();
                            evaluateSpeechSuccess();
                            return;
                        }
                    }
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') {
                    // Niets gehoord
                } else if (event.error === 'not-allowed') {
                    showPictoFeedback("⚠️ Geef microfoontoegang in je instellingen.", true);
                    showSpeechFallback("Microfoontoegang staat uit. Je kan ook zonder microfoon oefenen:");
                } else if (event.error === 'network') {
                    showPictoFeedback("⚠️ Geen verbinding voor spraakherkenning.", true);
                    showSpeechFallback("Spraakherkenning heeft internet nodig. Je kan ook zonder microfoon oefenen:");
                }
            };

            recognition.onend = () => {
                if (!isProcessingSpeech && currentMode === 3) {
                    if (!hasMatchedInSession) {
                        if (hasReceivedSpeech) {
                            handleSpeechError();
                        } else {
                            if (isAutoListening) {
                                showPictoFeedback("👂 Ik luister...", false);
                                setTimeout(() => {
                                    if (currentMode === 3 && isAutoListening && !isProcessingSpeech) {
                                        startListening();
                                    }
                                }, 300);
                            } else {
                                document.getElementById('speak-btn').innerText = "🎤 Druk om te starten";
                                showPictoFeedback("💡 Druk op de knop en spreek het woord uit.", false);
                            }
                        }
                    }
                } else if (!isAutoListening) {
                    document.getElementById('speak-btn').innerText = "🎤 Druk om te starten";
                }
            };
        } catch (e) {
            speechRecognitionSupported = false;
            recognition = null;
        }
    }

    function startListening() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        showPictoFeedback('', false);
        isProcessingSpeech = false;
        hasMatchedInSession = false;
        hasReceivedSpeech = false;
        isAutoListening = true;

        if (!recognition) {
            showSpeechFallback("Spraakherkenning wordt niet ondersteund op dit toestel. Je kan ook zonder microfoon oefenen:");
            return;
        }

        try {
            recognition.start();
        } catch (e) {
            recognitionRestartAttempts++;
            if (recognitionRestartAttempts <= 2) {
                try {
                    recognition.stop();
                    setTimeout(() => {
                        try { recognition.start(); } catch (err2) {
                            showSpeechFallback("Spraakherkenning start niet op. Je kan ook zonder microfoon oefenen:");
                        }
                    }, 150);
                } catch (err) {
                    showSpeechFallback("Spraakherkenning start niet op. Je kan ook zonder microfoon oefenen:");
                }
            } else {
                showSpeechFallback("Spraakherkenning start niet op. Je kan ook zonder microfoon oefenen:");
            }
        }
    }

    function showSpeechFallback(message) {
        isAutoListening = false;
        const warning = document.getElementById('speech-warning');
        warning.style.display = 'block';
        warning.innerText = `ℹ️ ${message}`;
        document.getElementById('speak-btn').style.display = 'none';
        document.getElementById('manual-confirm-btn').style.display = 'block';
    }

    function manualConfirmWord() {
        currentWordFailed = true;
        showPictoFeedback('🌟 Goed zo!', false);
        triggerRandomAnimation();

        setTimeout(() => {
            if (currentMode === 3) {
                if (currentIndex < wordList.length - 1) {
                    nextWord();
                } else {
                    showCompletionView();
                }
            }
        }, 500);
    }

    function isFuzzyMatch(spoken, target) {
        if (target.length <= 4) {
            return spoken === target;
        }
        const dist = levenshtein(spoken, target);
        const similarity = 1 - (dist / Math.max(spoken.length, target.length));
        return similarity >= 0.85;
    }

    function levenshtein(a, b) {
        const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
        for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
        for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

        for (let i = 1; i <= a.length; i++) {
            for (let j = 1; j <= b.length; j++) {
                const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                matrix[i][j] = Math.min(
                    matrix[i - 1][j] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j - 1] + cost
                );
            }
        }
        return matrix[a.length][b.length];
    }

    function evaluateSpeechSuccess() {
        if (!currentWordFailed) {
            correctCount++;
        }

        showPictoFeedback('🌟 Goed zo!', false);
        triggerRandomAnimation();

        setTimeout(() => {
            isProcessingSpeech = false;
            if (currentMode === 3) {
                if (currentIndex < wordList.length - 1) {
                    nextWord();
                } else {
                    showCompletionView();
                }
            }
        }, 600);
    }

    function handleSpeechError() {
        isProcessingSpeech = true;
        currentWordFailed = true;
        currentWordErrorCount++;

        const card = document.getElementById('target-word');
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 400);

        const currentWord = wordList[currentIndex];

        if (currentWordErrorCount === 1) {
            showPictoFeedback(`❌ Probeer nog eens!`, true);
            speakText("Probeer nog eens.", () => {
                setTimeout(() => {
                    isProcessingSpeech = false;
                    if (currentMode === 3 && isAutoListening) {
                        startListening();
                    }
                }, 300);
            });
        } else {
            showPictoFeedback(`❌ Het juiste woord is: "${currentWord}"`, true);
            speakText(currentWord, () => {
                setTimeout(() => {
                    isProcessingSpeech = false;
                    if (currentIndex < wordList.length - 1) {
                        nextWord();
                    } else {
                        showCompletionView();
                    }
                }, 500);
            });
        }
    }

    /* OEFENMODI */
    document.getElementById('start-practice-btn').addEventListener('click', () => {
        const rawText = wordsInput.value.trim();
        if (!rawText) return;
        wordList = rawText.split('\n').map(w => w.trim()).filter(w => w.length > 0);
        currentIndex = 0;
        correctCount = 0;
        switchStep('step-practice');
        requestWakeLock(); // Scherm actief houden bij het starten van de oefening
        renderFullList();
        setMode(1);
    });

    function renderFullList() {
        const container = document.getElementById('full-list-container');
        container.innerHTML = '';
        wordList.forEach((word, idx) => {
            const badge = document.createElement('div');
            badge.className = 'word-badge'; badge.id = `badge-${idx}`; badge.innerText = word;
            container.appendChild(badge);
        });
    }

    function setMode(mode) {
        currentMode = mode;
        stopSpeechAndTimers();

        document.querySelectorAll('.tab-btn').forEach((tab, i) => {
            tab.classList.toggle('active', i + 1 === mode);
        });

        const fullListView = document.getElementById('full-list-view');
        const singleWordView = document.getElementById('single-word-view');
        const speedControl = document.getElementById('speed-control-box');
        const playListBtn = document.getElementById('play-list-btn');

        showPictoFeedback('', false);

        if (mode === 1 || mode === 2) {
            fullListView.style.display = 'block';
            singleWordView.style.display = 'none';
            speedControl.style.display = 'flex';
            playListBtn.innerText = mode === 1 ? "🔊 Beluister het rijtje" : "🗣️ Nu samen lezen";
        } else if (mode === 3) {
            fullListView.style.display = 'none';
            singleWordView.style.display = 'block';
            speedControl.style.display = 'none';
            currentIndex = 0;
            correctCount = 0;

            if (speechRecognitionSupported) {
                document.getElementById('speak-btn').style.display = 'block';
                document.getElementById('manual-confirm-btn').style.display = 'none';
                document.getElementById('speech-warning').style.display = 'none';
            } else {
                showSpeechFallback("Spraakherkenning wordt niet ondersteund op dit toestel. Je kan ook zonder microfoon oefenen:");
            }

            updateSingleWordUI();
        }
    }

    function handleFullListAction() {
        if (isPlayingList) { stopSpeechAndTimers(); return; }

        if (currentMode === 1) {
            readFullListSequentially();
        } else if (currentMode === 2) {
            const container = document.getElementById('full-list-container');

            const oldOverlay = document.getElementById('countdown-overlay');
            if (oldOverlay) oldOverlay.remove();

            const overlay = document.createElement('div');
            overlay.id = 'countdown-overlay';
            overlay.className = 'countdown-overlay';
            container.appendChild(overlay);

            let count = 3;
            overlay.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    overlay.innerText = count;
                } else {
                    clearInterval(timer);
                    overlay.innerText = "🗣️";
                    setTimeout(() => {
                        overlay.remove();
                        readFullListSequentially();
                    }, 600);
                }
            }, 800);
        }
    }

    function readFullListSequentially() {
        stopSpeechAndTimers();
        isPlayingList = true;

        const playBtn = document.getElementById('play-list-btn');
        playBtn.innerText = "⏹️ Stop"; playBtn.className = "btn btn-secondary";
        let index = 0;

        function speakNext() {
            if (index >= wordList.length || !isPlayingList) {
                stopSpeechAndTimers();
                showPictoFeedback('🌟 Super gedaan!', false);
                triggerRandomAnimation();
                return;
            }

            clearWordHighlights();
            const badge = document.getElementById(`badge-${index}`);
            if (badge) {
                badge.classList.add('active-word');
                // Automatisch meescrollen naar het actieve woord
                badge.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            speakText(wordList[index], () => {
                if (!isPlayingList) return;
                index++;
                const speedVal = parseFloat(document.getElementById('speed-slider').value);
                const pauseBetweenWords = Math.max(350, Math.round(1400 - (speedVal * 1300)));

                setTimeout(speakNext, pauseBetweenWords);
            });
        }
        speakNext();
    }

    function clearWordHighlights() {
        document.querySelectorAll('.word-badge').forEach(b => b.classList.remove('active-word'));
    }

    function stopSpeechAndTimers() {
        isPlayingList = false;
        isAutoListening = false;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (recognition) {
            try { recognition.stop(); } catch(e) {}
        }

        const oldOverlay = document.getElementById('countdown-overlay');
        if (oldOverlay) oldOverlay.remove();

        clearWordHighlights();
        const playBtn = document.getElementById('play-list-btn');
        if (playBtn) {
            playBtn.className = "btn";
            playBtn.innerText = currentMode === 1 ? "🔊 Beluister het rijtje" : "🗣️ Nu samen lezen";
        }
    }

    function updateSingleWordUI() {
        currentWordFailed = false;
        currentWordErrorCount = 0;
        document.getElementById('target-word').innerText = wordList[currentIndex];
        document.getElementById('progress-text').innerText = `Woord ${currentIndex + 1} van ${wordList.length}`;
        showPictoFeedback('', false);

        if (isAutoListening) {
            document.getElementById('speak-btn').innerText = "🎙️ Aan het luisteren...";
            setTimeout(() => {
                if (currentMode === 3 && isAutoListening && !isProcessingSpeech) {
                    startListening();
                }
            }, 400);
        } else {
            document.getElementById('speak-btn').innerText = "🎤 Druk om te starten";
        }
    }

    function showPictoFeedback(msg, isError = false) {
        const fb = document.getElementById('picto-feedback');
        fb.innerText = msg;
        if (isError) fb.classList.add('error-msg');
        else fb.classList.remove('error-msg');
    }

    function triggerRandomAnimation() {
        const choice = Math.floor(Math.random() * 3);
        if (choice === 0) safeConfetti({ particleCount: 70, spread: 50, origin: { y: 0.6 } });
        else showOverlayEmoji(choice === 1 ? '👍' : '🌟');
    }

    function showOverlayEmoji(emoji) {
        const container = document.getElementById('anim-container');
        const el = document.createElement('div');
        el.className = 'thumbs-up-anim'; el.innerText = emoji;
        container.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    function nextWord() {
        if (currentIndex < wordList.length - 1) {
            currentIndex++;
            updateSingleWordUI();
        }
    }

    function prevWord() {
        if (currentIndex > 0) {
            currentIndex--;
            updateSingleWordUI();
        }
    }

    function showCompletionView() {
        stopSpeechAndTimers();
        releaseWakeLock(); // Vrijgeven bij het afronden

        const scoreElem = document.getElementById('score-display');
        if (currentMode === 3) {
            scoreElem.style.display = 'block';
            scoreElem.innerHTML = `🎯 Score: <strong>${correctCount} / ${wordList.length}</strong> goed in één keer!`;
        } else {
            scoreElem.style.display = 'none';
        }

        switchStep('step-finished');
        safeConfetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
    }

    function switchStep(stepId) {
        document.querySelectorAll('.step-panel').forEach(panel => panel.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
        currentStepId = stepId;

        if (stepId === 'step-practice') {
            requestWakeLock();
        } else {
            releaseWakeLock();
        }
    }

    function resetApp() {
        if (currentStepId !== 'step-upload') {
            const ok = confirm("Weet je zeker dat je wilt stoppen? Je huidige voortgang gaat verloren.");
            if (!ok) return;
        }
        stopSpeechAndTimers();
        releaseWakeLock();
        location.reload();
    }
</script>
</body>
</html>
