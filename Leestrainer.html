<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leestrainer</title>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card: #FFFFFF;
            --text: #1F2937;
            --highlight: #FEF08A;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
            position: relative;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #F3F4F6;
            padding-bottom: 10px;
        }

        .header-bar h1 { font-size: 1.5rem; margin: 0; color: var(--primary); }

        .btn-home {
            background-color: #F3F4F6; color: #4B5563; border: 1px solid #D1D5DB;
            padding: 6px 12px; border-radius: 10px; font-size: 0.9rem; font-weight: bold; cursor: pointer;
        }

        .step-panel { display: none; }
        .step-panel.active { display: block; }

        .btn {
            display: block; width: 100%; padding: 14px; margin: 10px 0;
            background-color: var(--primary); color: white; border: none;
            border-radius: 12px; font-size: 1.1rem; font-weight: 600; text-align: center; cursor: pointer;
            box-sizing: border-box;
        }

        .btn-secondary { background-color: #6B7280; }
        .btn-outline { background-color: transparent; border: 2px solid var(--primary); color: var(--primary); }

        input[type="file"] { display: none; }

        /* ZOOM CONTROLS & CANVAS HOLDER */
        .zoom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            background: #EEF2FF;
            padding: 8px;
            border-radius: 10px;
        }

        .zoom-btn {
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            color: var(--primary);
        }

        .canvas-container {
            position: relative; 
            width: 100%; 
            max-height: 60vh;
            margin: 10px 0;
            background: #000; 
            border-radius: 12px; 
            overflow: auto; /* Zorgt voor scrollen bij inzoomen */
            display: none;
            -webkit-overflow-scrolling: touch;
        }

        canvas { display: block; cursor: crosshair; touch-action: none; }

        textarea {
            width: 100%; height: 140px; border: 1px solid #D1D5DB;
            border-radius: 10px; padding: 10px; box-sizing: border-box; font-size: 1.2rem; margin-bottom: 10px;
        }

        .method-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 12px 5px; font-size: 1.1rem; border: 2px solid #D1D5DB;
            background: #F9FAFB; border-radius: 10px; font-weight: bold; cursor: pointer; text-align: center; color: #4B5563;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .speed-control {
            background: #EEF2FF; padding: 12px 15px; border-radius: 12px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
        }
        .speed-slider { flex: 1; height: 8px; border-radius: 5px; outline: none; accent-color: var(--primary); }

        .full-list-card {
            position: relative;
            background-color: #F9FAFB; border: 2px dashed #CBD5E1; border-radius: 16px;
            padding: 20px; margin: 15px 0; display: flex; flex-direction: column; gap: 12px; align-items: center;
            min-height: 150px;
            overflow: hidden;
        }

        /* GROTE AFTELLER OVERLAY VOOR KOORLEZEN */
        .countdown-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 6.5rem;
            font-weight: 900;
            color: var(--primary);
            z-index: 20;
            border-radius: 16px;
            animation: pulseCount 0.7s infinite alternate ease-in-out;
        }

        @keyframes pulseCount {
            0% { transform: scale(0.85); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .word-badge {
            background: #FFFFFF; border: 1px solid #CBD5E1; padding: 12px 20px; border-radius: 12px;
            font-size: 1.4rem; font-weight: 600; color: #334155; transition: all 0.2s ease; width: 85%; text-align: center; box-sizing: border-box;
        }
        .word-badge.active-word {
            background-color: var(--highlight); border-color: #EAB308; transform: scale(1.05); color: #854D0E;
        }

        .single-word-card {
            background-color: #EEF2FF; border: 3px solid var(--primary); border-radius: 16px;
            padding: 30px; text-align: center; font-size: 2.8rem; font-weight: bold; margin: 15px 0; color: #312E81;
        }

        .picto-feedback { text-align: center; font-size: 4rem; min-height: 70px; margin-top: 10px; }
        .loader { text-align: center; display: none; margin: 15px 0; font-weight: bold; color: var(--primary); }
        .nav-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; }

        .anim-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999;
            display: flex; justify-content: center; align-items: center;
        }
        .thumbs-up-anim { font-size: 7rem; animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes bounceIn { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
    </style>
</head>
<body>

<div id="anim-container" class="anim-overlay"></div>

<div class="container">
    <div class="header-bar">
        <h1>📖 Leestrainer</h1>
        <button class="btn-home" onclick="resetApp()">🏠 Home</button>
    </div>

    <!-- STAP 1: FOTO & VAKKEN TEKENEN -->
    <div id="step-upload" class="step-panel active">
        <label for="camera-input" class="btn">📸 Foto Maken / Kiezen</label>
        <input type="file" id="camera-input" accept="image/*" capture="environment">

        <div id="draw-controls" style="display:none;">
            <!-- ZOOM KNOPPEN -->
            <div class="zoom-bar">
                <span>🔍 Zoom:</span>
                <button class="zoom-btn" onclick="adjustZoom(0.25)">➕ In</button>
                <button class="zoom-btn" onclick="adjustZoom(-0.25)">➖ Uit</button>
                <button class="zoom-btn" onclick="resetZoom()">🔄 100%</button>
            </div>

            <div class="canvas-container" id="canvas-container">
                <canvas id="image-canvas"></canvas>
            </div>

            <p style="text-align:center; font-size: 0.85rem; color: #4B5563; margin: 5px 0 10px 0;">
                👉 Trek een kader. Versleep bolletjes om aan te passen.
            </p>
            
            <button id="process-boxes-btn" class="btn">✂️ Herken Tekst Uit Vakken</button>
            
            <div style="display: flex; gap: 8px;">
                <button id="undo-box-btn" class="btn btn-secondary" style="margin-top: 5px;">↩️ Laatste Vak Wissen</button>
                <button id="clear-boxes-btn" class="btn btn-secondary" style="margin-top: 5px;">🗑️ Alles Wissen</button>
            </div>
        </div>

        <div id="ocr-loader" class="loader">⏳ Tekst wordt herkend...</div>
    </div>

    <!-- STAP 2 -->
    <div id="step-review" class="step-panel">
        <p><strong>Herkende woorden:</strong></p>
        <textarea id="words-input" placeholder="Elk woord op een nieuwe regel..."></textarea>
        <button id="start-practice-btn" class="btn">🚀 Start Leesoefening</button>
    </div>

    <!-- STAP 3 -->
    <div id="step-practice" class="step-panel">
        <div class="method-tabs">
            <button class="tab-btn active" id="tab-1" onclick="setMode(1)">VOOR</button>
            <button class="tab-btn" id="tab-2" onclick="setMode(2)">KOOR</button>
            <button class="tab-btn" id="tab-3" onclick="setMode(3)">DOOR</button>
        </div>

        <div class="speed-control" id="speed-control-box">
            <span class="speed-icon">🐢</span>
            <input type="range" id="speed-slider" class="speed-slider" min="0.1" max="0.8" step="0.05" value="0.35">
            <span class="speed-icon">🐇</span>
        </div>

        <div id="full-list-view">
            <div class="full-list-card" id="full-list-container"></div>
            <button id="play-list-btn" class="btn" onclick="handleFullListAction()">🔊 Beluister het rijtje</button>
        </div>

        <div id="single-word-view" style="display:none;">
            <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #666; margin-bottom: 5px;">
                <span id="progress-text">Woord 1 van 5</span>
            </div>

            <div class="single-word-card" id="target-word">...</div>

            <button id="speak-btn" class="btn" onclick="startListening()">🎤 Druk om te spreken</button>

            <div class="nav-buttons">
                <button class="btn btn-outline" style="margin:0;" onclick="prevWord()">⬅️ Vorige</button>
                <button class="btn btn-outline" style="margin:0;" onclick="nextWord(false)">Volgende ➡️</button>
            </div>
        </div>

        <div id="picto-feedback" class="picto-feedback"></div>
    </div>

    <!-- STAP 4 -->
    <div id="step-finished" class="step-panel">
        <div style="text-align: center; padding: 20px 10px;">
            <div style="font-size: 5rem;">🏆🌟🎉</div>
            <h2 style="color: var(--primary);">Super gedaan!</h2>
            <button class="btn" onclick="setMode(1); switchStep('step-practice');">🔄 Nog eens oefenen</button>
            <button class="btn btn-secondary" onclick="resetApp()">📸 Nieuwe foto maken</button>
        </div>
    </div>
</div>

<script>
    let loadedImage = null;
    let canvas = document.getElementById('image-canvas');
    let ctx = canvas.getContext('2d');
    
    let boxes = [];
    let isDrawing = false;
    let dragState = null;
    let startX, startY, currentX, currentY;
    let zoomLevel = 1.0;

    const HANDLE_RADIUS = 22; 

    let wordList = [];
    let currentIndex = 0;
    let currentMode = 1;
    let recognition = null;
    let isPlayingList = false;
    let errorCount = 0;
    let isProcessingSpeech = false;

    const cameraInput = document.getElementById('camera-input');
    const canvasContainer = document.getElementById('canvas-container');
    const drawControls = document.getElementById('draw-controls');
    const ocrLoader = document.getElementById('ocr-loader');
    const wordsInput = document.getElementById('words-input');

    function speakText(text, onEndCallback = null) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = parseFloat(document.getElementById('speed-slider').value);
        utterance.lang = 'nl-BE';

        const voices = window.speechSynthesis.getVoices();
        const flemishVoice = voices.find(v => 
            v.lang === 'nl-BE' || v.lang.includes('BE') || 
            (v.lang.includes('nl') && (v.name.toLowerCase().includes('belgium') || v.name.toLowerCase().includes('flemish') || v.name.toLowerCase().includes('ellen')))
        );

        if (flemishVoice) utterance.voice = flemishVoice;
        if (onEndCallback) utterance.onend = onEndCallback;

        window.speechSynthesis.speak(utterance);
    }

    cameraInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            loadedImage = new Image();
            loadedImage.onload = () => {
                zoomLevel = 1.0;
                setupCanvas();
                canvasContainer.style.display = 'block';
                drawControls.style.display = 'block';
            };
            loadedImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function setupCanvas() {
        boxes = [];
        const containerWidth = canvasContainer.clientWidth || 460;
        const baseScale = containerWidth / loadedImage.width;
        
        canvas.width = containerWidth;
        canvas.height = loadedImage.height * baseScale;
        
        applyZoomStyle();
        redrawCanvas();
    }

    /* ZOOM FUNCTIES */
    function adjustZoom(delta) {
        zoomLevel = Math.max(0.75, Math.min(2.5, zoomLevel + delta));
        applyZoomStyle();
    }

    function resetZoom() {
        zoomLevel = 1.0;
        applyZoomStyle();
    }

    function applyZoomStyle() {
        const containerWidth = canvasContainer.clientWidth || 460;
        canvas.style.width = (containerWidth * zoomLevel) + 'px';
    }

    function redrawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);

        boxes.forEach((box, index) => {
            ctx.strokeStyle = '#4F46E5';
            ctx.lineWidth = 3;
            ctx.strokeRect(box.x, box.y, box.w, box.h);
            ctx.fillStyle = 'rgba(79, 70, 229, 0.15)';
            ctx.fillRect(box.x, box.y, box.w, box.h);

            ctx.fillStyle = '#4F46E5';
            ctx.fillRect(box.x, box.y, 26, 26);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 15px sans-serif';
            ctx.fillText((index + 1).toString(), box.x + 8, box.y + 18);

            drawHandles(box);
        });

        if (isDrawing) {
            ctx.strokeStyle = '#10B981';
            ctx.lineWidth = 2;
            ctx.strokeRect(startX, startY, currentX - startX, currentY - startY);
        }
    }

    function drawHandles(box) {
        const { x, y, w, h } = box;
        const handles = [
            { x: x, y: y }, { x: x + w / 2, y: y }, { x: x + w, y: y },
            { x: x + w, y: y + h / 2 }, { x: x + w, y: y + h },
            { x: x + w / 2, y: y + h }, { x: x, y: y + h }, { x: x, y: y + h / 2 }
        ];

        handles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 9, 0, 2 * Math.PI);
            ctx.fillStyle = '#FFFFFF';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#4F46E5';
            ctx.stroke();
        });
    }

    function getHandleAt(pos) {
        for (let i = boxes.length - 1; i >= 0; i--) {
            const b = boxes[i];
            const { x, y, w, h } = b;
            const handles = [
                { name: 'nw', x: x, y: y }, { name: 'ne', x: x + w, y: y },
                { name: 'sw', x: x, y: y + h }, { name: 'se', x: x + w, y: y + h },
                { name: 'n',  x: x + w / 2, y: y }, { name: 's',  x: x + w / 2, y: y + h },
                { name: 'w',  x: x, y: y + h / 2 }, { name: 'e',  x: x + w, y: y + h / 2 }
            ];

            for (let hnd of handles) {
                if (Math.hypot(pos.x - hnd.x, pos.y - hnd.y) <= HANDLE_RADIUS) {
                    return { boxIndex: i, handle: hnd.name };
                }
            }
            if (pos.x >= x && pos.x <= x + w && pos.y >= y && pos.y <= y + h) {
                return { boxIndex: i, handle: 'move' };
            }
        }
        return null;
    }

    /* AANGEPAST VOOR EXACTE TOUCH-MAPPING BIJ ZOOM */
    function getCanvasCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        return { 
            x: (clientX - rect.left) * (canvas.width / rect.width), 
            y: (clientY - rect.top) * (canvas.height / rect.height) 
        };
    }

    function handleStart(e) {
        const pos = getCanvasCoordinates(e);
        const hit = getHandleAt(pos);

        if (hit) {
            dragState = { boxIndex: hit.boxIndex, handle: hit.handle, startPos: pos, initialBox: { ...boxes[hit.boxIndex] } };
        } else {
            isDrawing = true;
            startX = pos.x; startY = pos.y; currentX = pos.x; currentY = pos.y;
        }
    }

    function handleMove(e) {
        const pos = getCanvasCoordinates(e);
        if (dragState) {
            const dx = pos.x - dragState.startPos.x;
            const dy = pos.y - dragState.startPos.y;
            const b = boxes[dragState.boxIndex];
            const init = dragState.initialBox;

            switch (dragState.handle) {
                case 'nw': b.x = init.x + dx; b.w = init.w - dx; b.y = init.y + dy; b.h = init.h - dy; break;
                case 'ne': b.w = init.w + dx; b.y = init.y + dy; b.h = init.h - dy; break;
                case 'sw': b.x = init.x + dx; b.w = init.w - dx; b.h = init.h + dy; break;
                case 'se': b.w = init.w + dx; b.h = init.h + dy; break;
                case 'n':  b.y = init.y + dy; b.h = init.h - dy; break;
                case 's':  b.h = init.h + dy; break;
                case 'w':  b.x = init.x + dx; b.w = init.w - dx; break;
                case 'e':  b.w = init.w + dx; break;
                case 'move': b.x = init.x + dx; b.y = init.y + dy; break;
            }
            redrawCanvas();
        } else if (isDrawing) {
            currentX = pos.x; currentY = pos.y;
            redrawCanvas();
        }
    }

    function handleEnd() {
        if (dragState) {
            const b = boxes[dragState.boxIndex];
            if (b.w < 0) { b.x += b.w; b.w = Math.abs(b.w); }
            if (b.h < 0) { b.y += b.h; b.h = Math.abs(b.h); }
            dragState = null;
            redrawCanvas();
        } else if (isDrawing) {
            isDrawing = false;
            let w = currentX - startX, h = currentY - startY, x = startX, y = startY;
            if (w < 0) { x = currentX; w = Math.abs(w); }
            if (h < 0) { y = currentY; h = Math.abs(h); }
            if (w > 20 && h > 20) boxes.push({ x, y, w, h });
            redrawCanvas();
        }
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', (e) => { handleStart(e); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { handleMove(e); e.preventDefault(); });
    canvas.addEventListener('touchend', handleEnd);

    /* KNOPPEN VOOR WISSEN & UNDO */
    document.getElementById('undo-box-btn').addEventListener('click', () => { 
        boxes.pop(); 
        redrawCanvas(); 
    });

    document.getElementById('clear-boxes-btn').addEventListener('click', () => { 
        boxes = []; 
        redrawCanvas(); 
    });

    /* OCR VERWERKING */
    document.getElementById('process-boxes-btn').addEventListener('click', async () => {
        if (boxes.length === 0) return alert("Trek eerst een kader rond een rijtje.");
        canvasContainer.style.display = 'none'; drawControls.style.display = 'none'; ocrLoader.style.display = 'block';

        let allRecognizedWords = [];
        const scaleX = loadedImage.width / canvas.width;
        const scaleY = loadedImage.height / canvas.height;

        for (let i = 0; i < boxes.length; i++) {
            const box = boxes[i];
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = box.w * scaleX; tempCanvas.height = box.h * scaleY;
            tempCtx.drawImage(loadedImage, box.x * scaleX, box.y * scaleY, box.w * scaleX, box.h * scaleY, 0, 0, tempCanvas.width, tempCanvas.height);

            try {
                const result = await Tesseract.recognize(tempCanvas, 'nld');
                result.data.text.split('\n').forEach(line => {
                    const clean = line.replace(/[^a-zA-ZáéíóúäëïöüÅå-]/g, "").trim();
                    if (clean.length > 0) allRecognizedWords.push(clean);
                });
            } catch (err) { console.error(err); }
        }

        ocrLoader.style.display = 'none';
        wordsInput.value = allRecognizedWords.join('\n');
        switchStep('step-review');
    });

    /* SPRAAKHERKENNING */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'nl-BE';
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 5;

        recognition.onresult = (event) => {
            if (isProcessingSpeech) return;

            const target = wordList[currentIndex].toLowerCase().trim();

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                for (let j = 0; j < event.results[i].length; j++) {
                    const spoken = event.results[i][j].transcript.toLowerCase().trim();
                    if (isFuzzyMatch(spoken, target)) {
                        isProcessingSpeech = true;
                        recognition.stop();
                        evaluateSpeechSuccess();
                        return;
                    }
                }
            }
        };

        recognition.onerror = () => {
            if (!isProcessingSpeech) {
                showPictoFeedback('👂');
                document.getElementById('speak-btn').innerText = "🎤 Druk om te spreken";
            }
        };
    }

    function isFuzzyMatch(spoken, target) {
        if (spoken.includes(target)) return true;
        const dist = levenshtein(spoken, target);
        if (target.length <= 4 && dist <= 1) return true;
        return (1 - (dist / Math.max(spoken.length, target.length))) >= 0.70;
    }

    function levenshtein(a, b) {
        const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
        for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
        for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

        for (let i = 1; i <= a.length; i++) {
            for (let j = 1; j <= b.length; j++) {
                const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                matrix[i][j] = Math.min(
                    matrix[i - 1][j] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j - 1] + cost
                );
            }
        }
        return matrix[a.length][b.length];
    }

    function evaluateSpeechSuccess() {
        errorCount = 0;
        showPictoFeedback('🌟');
        triggerRandomAnimation();

        setTimeout(() => {
            isProcessingSpeech = false;
            if (currentMode === 3) {
                if (currentIndex < wordList.length - 1) {
                    nextWord(true);
                } else {
                    showCompletionView();
                }
            }
        }, 400);
    }

    function startListening() {
        showPictoFeedback('');
        isProcessingSpeech = false;
        if (!recognition) return alert("Spraakherkenning wordt niet ondersteund.");
        
        document.getElementById('speak-btn').innerText = "🎙️ Aan het luisteren...";
        try { recognition.start(); } catch(e) { recognition.stop(); recognition.start(); }
    }

    /* OEFENMODI & KOORLEZEN AFTELLER */
    document.getElementById('start-practice-btn').addEventListener('click', () => {
        const rawText = wordsInput.value.trim();
        if (!rawText) return;
        wordList = rawText.split('\n').map(w => w.trim()).filter(w => w.length > 0);
        currentIndex = 0;
        switchStep('step-practice');
        renderFullList();
        setMode(1);
    });

    function renderFullList() {
        const container = document.getElementById('full-list-container');
        container.innerHTML = '';
        wordList.forEach((word, idx) => {
            const badge = document.createElement('div');
            badge.className = 'word-badge'; badge.id = `badge-${idx}`; badge.innerText = word;
            container.appendChild(badge);
        });
    }

    function setMode(mode) {
        currentMode = mode;
        stopSpeechAndTimers();

        document.querySelectorAll('.tab-btn').forEach((tab, i) => {
            tab.classList.toggle('active', i + 1 === mode);
        });

        const fullListView = document.getElementById('full-list-view');
        const singleWordView = document.getElementById('single-word-view');
        const speedControl = document.getElementById('speed-control-box');
        const playListBtn = document.getElementById('play-list-btn');

        showPictoFeedback('');

        if (mode === 1 || mode === 2) {
            fullListView.style.display = 'block';
            singleWordView.style.display = 'none';
            speedControl.style.display = 'flex';
            playListBtn.innerText = mode === 1 ? "🔊 Beluister het rijtje" : "🗣️ Nu samen lezen";
        } else if (mode === 3) {
            fullListView.style.display = 'none';
            singleWordView.style.display = 'block';
            speedControl.style.display = 'none';
            currentIndex = 0; errorCount = 0;
            updateSingleWordUI();
        }
    }

    function handleFullListAction() {
        if (isPlayingList) { stopSpeechAndTimers(); return; }

        if (currentMode === 1) {
            readFullListSequentially();
        } else if (currentMode === 2) {
            /* GROTE 3-2-1 AFTELLING OVER DE WOORDEN */
            const container = document.getElementById('full-list-container');
            
            // Verwijder eventuele oude overlay
            const oldOverlay = document.getElementById('countdown-overlay');
            if (oldOverlay) oldOverlay.remove();

            const overlay = document.createElement('div');
            overlay.id = 'countdown-overlay';
            overlay.className = 'countdown-overlay';
            container.appendChild(overlay);

            let count = 3;
            overlay.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    overlay.innerText = count;
                } else {
                    clearInterval(timer);
                    overlay.innerText = "🗣️";
                    setTimeout(() => {
                        overlay.remove();
                        readFullListSequentially();
                    }, 600);
                }
            }, 800);
        }
    }

    /* DYNAMISCHE PAUZE BIJ TRAAG VOORLEZEN */
    function readFullListSequentially() {
        stopSpeechAndTimers();
        isPlayingList = true;

        const playBtn = document.getElementById('play-list-btn');
        playBtn.innerText = "⏹️ Stop"; playBtn.className = "btn btn-secondary";
        let index = 0;

        function speakNext() {
            if (index >= wordList.length || !isPlayingList) {
                stopSpeechAndTimers();
                showPictoFeedback('🌟');
                triggerRandomAnimation();
                return;
            }

            clearWordHighlights();
            const badge = document.getElementById(`badge-${index}`);
            if (badge) badge.classList.add('active-word');

            speakText(wordList[index], () => {
                index++;
                
                // Bereken pauze op basis van spreeksnelheid (Bij 0.1 rate = ~1300ms pauze, bij 0.8 rate = ~350ms pauze)
                const speedVal = parseFloat(document.getElementById('speed-slider').value);
                const pauseBetweenWords = Math.max(350, Math.round(1400 - (speedVal * 1300)));

                setTimeout(speakNext, pauseBetweenWords);
            });
        }
        speakNext();
    }

    function clearWordHighlights() {
        document.querySelectorAll('.word-badge').forEach(b => b.classList.remove('active-word'));
    }

    function stopSpeechAndTimers() {
        isPlayingList = false;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        
        const oldOverlay = document.getElementById('countdown-overlay');
        if (oldOverlay) oldOverlay.remove();

        clearWordHighlights();
        const playBtn = document.getElementById('play-list-btn');
        if (playBtn) {
            playBtn.className = "btn";
            playBtn.innerText = currentMode === 1 ? "🔊 Beluister het rijtje" : "🗣️ Nu samen lezen";
        }
    }

    function updateSingleWordUI() {
        document.getElementById('target-word').innerText = wordList[currentIndex];
        document.getElementById('progress-text').innerText = `Woord ${currentIndex + 1} van ${wordList.length}`;
        document.getElementById('speak-btn').innerText = "🎤 Druk om te spreken";
        showPictoFeedback('');
    }

    function showPictoFeedback(emoji) { document.getElementById('picto-feedback').innerText = emoji; }

    function triggerRandomAnimation() {
        const choice = Math.floor(Math.random() * 3);
        if (choice === 0) confetti({ particleCount: 70, spread: 50, origin: { y: 0.6 } });
        else showOverlayEmoji(choice === 1 ? '👍' : '🌟');
    }

    function showOverlayEmoji(emoji) {
        const container = document.getElementById('anim-container');
        const el = document.createElement('div');
        el.className = 'thumbs-up-anim'; el.innerText = emoji;
        container.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    function nextWord(autoListen = false) {
        if (currentIndex < wordList.length - 1) {
            currentIndex++; errorCount = 0;
            updateSingleWordUI();
            if (autoListen) setTimeout(() => startListening(), 200);
        }
    }

    function prevWord() {
        if (currentIndex > 0) {
            currentIndex--; errorCount = 0;
            updateSingleWordUI();
        }
    }

    function showCompletionView() {
        stopSpeechAndTimers();
        switchStep('step-finished');
        confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
    }

    function switchStep(stepId) {
        document.querySelectorAll('.step-panel').forEach(panel => panel.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    function resetApp() { stopSpeechAndTimers(); location.reload(); }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }
</script>
</body>
</html>
