<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Leestrainer</title>

    <!-- Cropper.js CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <!-- Canvas Confetti Library voor animaties -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card: #FFFFFF;
            --text: #1F2937;
            --success: #10B981;
            --danger: #EF4444;
            --highlight: #FEF08A;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
            position: relative;
        }

        h1 { font-size: 1.6rem; text-align: center; margin-top: 0; color: var(--primary); }
        
        .step-panel { display: none; }
        .step-panel.active { display: block; }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            box-sizing: border-box;
        }

        .btn-secondary { background-color: #6B7280; }
        .btn-outline { background-color: transparent; border: 2px solid var(--primary); color: var(--primary); }
        
        input[type="file"] { display: none; }
        
        .img-container {
            width: 100%;
            max-height: 300px;
            margin: 15px 0;
            overflow: hidden;
            border-radius: 10px;
        }
        
        img { max-width: 100%; }

        textarea {
            width: 100%;
            height: 120px;
            border: 1px solid #D1D5DB;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            font-size: 1.1rem;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .method-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            font-size: 1.1rem;
            border: 2px solid #D1D5DB;
            background: #F9FAFB;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            color: #4B5563;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .full-list-card {
            background-color: #F9FAFB;
            border: 2px dashed #CBD5E1;
            border-radius: 16px;
            padding: 20px;
            margin: 15px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 120px;
            align-items: center;
        }

        .word-badge {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #334155;
            transition: all 0.2s ease;
        }

        .word-badge.active-word {
            background-color: var(--highlight);
            border-color: #EAB308;
            transform: scale(1.15);
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3);
            color: #854D0E;
        }

        .single-word-card {
            background-color: #EEF2FF;
            border: 3px solid var(--primary);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 15px 0;
            color: #312E81;
            position: relative;
        }

        .feedback-box {
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            display: none;
            font-size: 1.05rem;
        }
        .feedback-box.success { display: block; background-color: #D1FAE5; color: #065F46; }
        .feedback-box.error { display: block; background-color: #FEE2E2; color: #991B1B; }

        .loader {
            text-align: center;
            display: none;
            margin: 15px 0;
            font-weight: bold;
            color: var(--primary);
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }

        .countdown-banner {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
            margin: 10px 0;
            min-height: 32px;
        }

        /* Overlay Animaties voor Succes */
        .anim-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .floating-emoji {
            font-size: 5rem;
            animation: popAndFade 1.2s ease-out forwards;
        }

        @keyframes popAndFade {
            0% { transform: scale(0.2) translateY(50px); opacity: 0; }
            50% { transform: scale(1.3) translateY(-20px); opacity: 1; }
            100% { transform: scale(1) translateY(-100px); opacity: 0; }
        }

        .thumbs-up-anim {
            font-size: 6rem;
            animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="anim-container" class="anim-overlay"></div>

<div class="container">
    <h1>📖 Leestrainer</h1>

    <!-- STAP 1: FOTO MAKEN & BIJSNIJDEN -->
    <div id="step-upload" class="step-panel active">
        <p style="text-align:center; font-size: 0.9rem; color: #666;">Neem een foto van het woordrijtje of kies een afbeelding.</p>
        
        <label for="camera-input" class="btn">📸 Foto Maken / Kiezen</label>
        <input type="file" id="camera-input" accept="image/*" capture="environment">

        <div class="img-container" id="crop-area" style="display:none;">
            <img id="image-to-crop" src="" alt="Woordrijtje">
        </div>

        <button id="crop-btn" class="btn" style="display:none;">✂️ Bijsnijden & Tekst Herkennen</button>

        <div id="ocr-loader" class="loader">⏳ Tekst wordt herkend...</div>
    </div>

    <!-- STAP 2: TEKST CONTROLEREN -->
    <div id="step-review" class="step-panel">
        <p><strong>Herkende woorden in het rijtje:</strong><br><small style="color:#666;">Plaats elk woord op een nieuwe regel.</small></p>
        <textarea id="words-input" placeholder="Elk woord op een nieuwe regel..."></textarea>
        <button id="start-practice-btn" class="btn">🚀 Start Leesoefening</button>
    </div>

    <!-- STAP 3: OEFENING MET 3 MODI -->
    <div id="step-practice" class="step-panel">
        
        <!-- Tabbladen: VOOR - KOOR - DOOR -->
        <div class="method-tabs">
            <button class="tab-btn active" id="tab-1" onclick="setMode(1)">VOOR</button>
            <button class="tab-btn" id="tab-2" onclick="setMode(2)">KOOR</button>
            <button class="tab-btn" id="tab-3" onclick="setMode(3)">DOOR</button>
        </div>

        <!-- WEERGAVE VOOR VOOR & KOOR (VOLLEDIGE RIJTJE) -->
        <div id="full-list-view">
            <div class="countdown-banner" id="countdown-banner"></div>
            <div class="full-list-card" id="full-list-container"></div>
            <button id="play-list-btn" class="btn" onclick="handleFullListAction()">🔊 Beluister het hele rijtje</button>
        </div>

        <!-- WEERGAVE VOOR DOOR (ZELF LEZEN PER WOORD) -->
        <div id="single-word-view" style="display:none;">
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: #666; margin-bottom: 5px;">
                <span id="progress-text">Woord 1 van 5</span>
            </div>

            <div class="single-word-card" id="target-word">...</div>

            <button id="speak-btn" class="btn" onclick="startListening()">🎤 Druk om te spreken</button>

            <div class="nav-buttons">
                <button class="btn btn-outline" style="margin:0;" onclick="prevWord()">⬅️ Vorige</button>
                <button class="btn btn-outline" style="margin:0;" onclick="nextWord()">Volgende ➡️</button>
            </div>
        </div>

        <div id="feedback" class="feedback-box"></div>
        
        <button class="btn btn-secondary" style="margin-top:20px;" onclick="resetApp()">🔄 Nieuwe Foto / Rijtje</button>
    </div>
</div>

<script>
    let cropper = null;
    let wordList = [];
    let currentIndex = 0;
    let currentMode = 1; // 1: VOOR, 2: KOOR, 3: DOOR
    let recognition = null;
    let isPlayingList = false;
    let errorCount = 0; // Telt het aantal fouten op het huidige woord

    const cameraInput = document.getElementById('camera-input');
    const imageToCrop = document.getElementById('image-to-crop');
    const cropArea = document.getElementById('crop-area');
    const cropBtn = document.getElementById('crop-btn');
    const ocrLoader = document.getElementById('ocr-loader');
    const wordsInput = document.getElementById('words-input');

    // Web Speech API - Spraakherkenning
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'nl-NL';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
            const spokenWord = event.results[0][0].transcript.toLowerCase().trim();
            evaluateSpeech(spokenWord);
        };

        recognition.onerror = (event) => {
            showFeedback(`Geen spraak herkend (${event.error}). Probeer opnieuw!`, 'error');
            document.getElementById('speak-btn').innerText = "🎤 Druk om te spreken";
        };

        recognition.onend = () => {
            if(currentMode === 3 && document.getElementById('speak-btn').innerText.includes("luisteren")) {
                document.getElementById('speak-btn').innerText = "🎤 Druk om te spreken";
            }
        };
    }

    // 1. Foto Upload & Cropper
    cameraInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                imageToCrop.src = event.target.result;
                cropArea.style.display = 'block';
                cropBtn.style.display = 'block';

                if (cropper) cropper.destroy();
                cropper = new Cropper(imageToCrop, {
                    viewMode: 1,
                    autoCropArea: 0.8,
                });
            };
            reader.readAsDataURL(file);
        }
    });

    // 2. OCR verwerking van de foto
    cropBtn.addEventListener('click', async () => {
        if (!cropper) return;
        
        const canvas = cropper.getCroppedCanvas();
        cropArea.style.display = 'none';
        cropBtn.style.display = 'none';
        ocrLoader.style.display = 'block';

        try {
            const result = await Tesseract.recognize(canvas, 'nld');
            ocrLoader.style.display = 'none';

            const extractedText = result.data.text;
            wordsInput.value = extractedText
                .split('\n')
                .map(w => w.trim().replace(/[^a-zA-ZáéíóúäëïöüÅå📑-]/g, ""))
                .filter(w => w.length > 0)
                .join('\n');

            switchStep('step-review');
        } catch (err) {
            alert('Er ging iets mis bij het lezen van de foto: ' + err.message);
            ocrLoader.style.display = 'none';
        }
    });

    // 3. Start Oefening
    document.getElementById('start-practice-btn').addEventListener('click', () => {
        const rawText = wordsInput.value.trim();
        if (!rawText) {
            alert("Voer ten minste één woord in.");
            return;
        }
        wordList = rawText.split('\n').map(w => w.trim()).filter(w => w.length > 0);
        currentIndex = 0;
        switchStep('step-practice');
        renderFullList();
        setMode(1);
    });

    function renderFullList() {
        const container = document.getElementById('full-list-container');
        container.innerHTML = '';
        wordList.forEach((word, idx) => {
            const badge = document.createElement('span');
            badge.className = 'word-badge';
            badge.id = `badge-${idx}`;
            badge.innerText = word;
            container.appendChild(badge);
        });
    }

    function setMode(mode) {
        currentMode = mode;
        stopSpeechAndTimers();

        document.querySelectorAll('.tab-btn').forEach((tab, i) => {
            tab.classList.toggle('active', i + 1 === mode);
        });

        const fullListView = document.getElementById('full-list-view');
        const singleWordView = document.getElementById('single-word-view');
        const playListBtn = document.getElementById('play-list-btn');
        document.getElementById('countdown-banner').innerText = '';

        hideFeedback();

        if (mode === 1) {
            fullListView.style.display = 'block';
            singleWordView.style.display = 'none';
            playListBtn.innerText = "🔊 Beluister het hele rijtje";
            playListBtn.className = "btn";
        } 
        else if (mode === 2) {
            fullListView.style.display = 'block';
            singleWordView.style.display = 'none';
            playListBtn.innerText = "🗣️ Lees samen het hele rijtje";
            playListBtn.className = "btn";
        } 
        else if (mode === 3) {
            fullListView.style.display = 'none';
            singleWordView.style.display = 'block';
            errorCount = 0;
            updateSingleWordUI();
        }
    }

    function handleFullListAction() {
        if (isPlayingList) {
            stopSpeechAndTimers();
            return;
        }

        if (currentMode === 1) {
            // VOOR: Zeer traag leestempo (0.55) voor maximale helderheid
            readFullListSequentially(0.55, 600);
        } else if (currentMode === 2) {
            // KOOR: Aftellen en traag leestempo (0.60)
            const banner = document.getElementById('countdown-banner');
            let count = 3;
            banner.innerText = `⏳ Samen lezen in ${count}...`;
            
            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    banner.innerText = `⏳ Samen lezen in ${count}...`;
                } else {
                    clearInterval(timer);
                    banner.innerText = "🗣️ Nu samen lezen!";
                    readFullListSequentially(0.60, 700);
                }
            }, 900);
        }
    }

    function readFullListSequentially(rate = 0.55, pauseMs = 600) {
        if (!('speechSynthesis' in window)) {
            alert("Spraakuitvoer wordt niet ondersteund op dit apparaat.");
            return;
        }

        stopSpeechAndTimers();
        isPlayingList = true;

        const playBtn = document.getElementById('play-list-btn');
        playBtn.innerText = "⏹️ Stop voorlezen";
        playBtn.className = "btn btn-secondary";

        let index = 0;

        function speakWord() {
            if (index >= wordList.length || !isPlayingList) {
                stopSpeechAndTimers();
                showFeedback("🎉 Rijtje voltooid!", 'success');
                triggerRandomAnimation();
                return;
            }

            clearWordHighlights();
            const badge = document.getElementById(`badge-${index}`);
            if (badge) badge.classList.add('active-word');

            const utterance = new SpeechSynthesisUtterance(wordList[index]);
            utterance.lang = 'nl-NL';
            utterance.rate = rate;

            utterance.onend = () => {
                index++;
                setTimeout(speakWord, pauseMs);
            };

            utterance.onerror = () => {
                stopSpeechAndTimers();
            };

            window.speechSynthesis.speak(utterance);
        }

        speakWord();
    }

    function clearWordHighlights() {
        document.querySelectorAll('.word-badge').forEach(b => b.classList.remove('active-word'));
    }

    function stopSpeechAndTimers() {
        isPlayingList = false;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        clearWordHighlights();
        
        const playBtn = document.getElementById('play-list-btn');
        if (playBtn) {
            playBtn.className = "btn";
            if (currentMode === 1) playBtn.innerText = "🔊 Beluister het hele rijtje";
            else if (currentMode === 2) playBtn.innerText = "🗣️ Lees samen het hele rijtje";
        }
    }

    // DOOR (Per woord lezen)
    function updateSingleWordUI() {
        document.getElementById('target-word').innerText = wordList[currentIndex];
        document.getElementById('progress-text').innerText = `Woord ${currentIndex + 1} van ${wordList.length}`;
        document.getElementById('speak-btn').innerText = "🎤 Druk om te spreken";
        hideFeedback();
    }

    function startListening() {
        hideFeedback();
        if (!recognition) {
            alert("Spraakherkenning wordt helaas niet ondersteund op deze browser.");
            return;
        }
        document.getElementById('speak-btn').innerText = "🎙️ Aan het luisteren...";
        try {
            recognition.start();
        } catch(e) {
            recognition.stop();
            recognition.start();
        }
    }

    // Beoordeling met strengere match & 2x fout regel
    function evaluateSpeech(spoken) {
        const target = wordList[currentIndex].toLowerCase().trim();
        const spokenClean = spoken.toLowerCase().trim();
        
        // STRENGERE MATCH: Exacte vergelijking
        if (spokenClean === target) {
            errorCount = 0;
            showFeedback(` Perfect gelezen! ("${spoken}")`, 'success');
            triggerRandomAnimation();
            
            setTimeout(() => {
                if (currentMode === 3 && currentIndex < wordList.length - 1) {
                    nextWord();
                }
            }, 1800);
        } else {
            errorCount++;
            
            if (errorCount >= 2) {
                // BIJ 2X FOUT: Lees het woord voor als hulp!
                showFeedback(`💡 Luister goed naar de juiste uitspraak!`, 'error');
                speakWordHelp(wordList[currentIndex]);
                errorCount = 0;
            } else {
                showFeedback(`❌ Bijna! We hoorden "${spoken}". Probeer nog eens!`, 'error');
            }
        }
        document.getElementById('speak-btn').innerText = "🎤 Druk om te spreken";
    }

    // Hulpspreker bij 2x fout
    function speakWordHelp(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'nl-NL';
            utterance.rate = 0.5;
            window.speechSynthesis.speak(utterance);
        }
    }

    // 5 VERSCHILLENDE SUCCES ANIMATIES
    function triggerRandomAnimation() {
        const choice = Math.floor(Math.random() * 5);

        if (choice === 0) {
            // 1. Confetti Burst
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        } 
        else if (choice === 1) {
            // 2. Sterrenregen
            confetti({
                particleCount: 80,
                spread: 100,
                origin: { y: 0.6 },
                shapes: ['star'],
                colors: ['#FFE100', '#FFBD00', '#E80054']
            });
        } 
        else if (choice === 2) {
            // 3. Dubbel Zij-Kanon
            confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0, y: 0.7 } });
            confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1, y: 0.7 } });
        } 
        else if (choice === 3) {
            // 4. Bouncing Thumbs Up
            showOverlayEmoji('👍', 'thumbs-up-anim');
        } 
        else if (choice === 4) {
            // 5. Feest / Applaus Emojis
            showOverlayEmoji('🎉 👏', 'floating-emoji');
        }
    }

    function showOverlayEmoji(emoji, cssClass) {
        const container = document.getElementById('anim-container');
        const el = document.createElement('div');
        el.className = cssClass;
        el.innerText = emoji;
        container.appendChild(el);

        setTimeout(() => {
            el.remove();
        }, 1500);
    }

    function nextWord() {
        if (currentIndex < wordList.length - 1) {
            currentIndex++;
            errorCount = 0;
            updateSingleWordUI();
        }
    }

    function prevWord() {
        if (currentIndex > 0) {
            currentIndex--;
            errorCount = 0;
            updateSingleWordUI();
        }
    }

    function showFeedback(msg, type) {
        const fb = document.getElementById('feedback');
        fb.innerText = msg;
        fb.className = `feedback-box ${type}`;
    }

    function hideFeedback() {
        const fb = document.getElementById('feedback');
        fb.className = 'feedback-box';
        fb.innerText = '';
    }

    function switchStep(stepId) {
        document.querySelectorAll('.step-panel').forEach(panel => panel.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    function resetApp() {
        stopSpeechAndTimers();
        location.reload();
    }
</script>

</body>
</html>
