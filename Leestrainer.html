<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leestrainer</title>

    <!-- Tesseract.js voor Tekstherkenning -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <!-- Canvas Confetti voor beloningen -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card: #FFFFFF;
            --text: #1F2937;
            --success: #10B981;
            --danger: #EF4444;
            --highlight: #FEF08A;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
            position: relative;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #F3F4F6;
            padding-bottom: 10px;
        }

        .header-bar h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--primary);
        }

        .btn-home {
            background-color: #F3F4F6;
            color: #4B5563;
            border: 1px solid #D1D5DB;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }

        .step-panel { display: none; }
        .step-panel.active { display: block; }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            box-sizing: border-box;
        }

        .btn-secondary { background-color: #6B7280; }
        .btn-outline { background-color: transparent; border: 2px solid var(--primary); color: var(--primary); }

        input[type="file"] { display: none; }

        /* CANVAS WAAROP JE RECHTHOEKEN KUNT TEKENEN EN AANPASSEN */
        .canvas-container {
            position: relative;
            width: 100%;
            margin: 15px 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: none;
        }

        canvas {
            display: block;
            width: 100%;
            cursor: crosshair;
            touch-action: none; /* Voorkomt scrollen tijdens tekenen en verslepen */
        }

        textarea {
            width: 100%;
            height: 140px;
            border: 1px solid #D1D5DB;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            font-size: 1.2rem;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .method-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            font-size: 1.1rem;
            border: 2px solid #D1D5DB;
            background: #F9FAFB;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            color: #4B5563;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* TEMPO SCHUIFKNOP */
        .speed-control {
            background: #EEF2FF;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-slider {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            outline: none;
            accent-color: var(--primary);
        }

        .speed-icon { font-size: 1.3rem; }

        /* VERTIKALE WOORDENLIJST */
        .full-list-card {
            background-color: #F9FAFB;
            border: 2px dashed #CBD5E1;
            border-radius: 16px;
            padding: 20px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            min-height: 120px;
        }

        .word-badge {
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: 600;
            color: #334155;
            transition: all 0.2s ease;
            width: 85%;
            text-align: center;
            box-sizing: border-box;
        }

        .word-badge.active-word {
            background-color: var(--highlight);
            border-color: #EAB308;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3);
            color: #854D0E;
        }

        .single-word-card {
            background-color: #EEF2FF;
            border: 3px solid var(--primary);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 15px 0;
            color: #312E81;
        }

        /* FEEDBACK MET PICTO'S */
        .picto-feedback {
            text-align: center;
            font-size: 4rem;
            min-height: 70px;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loader {
            text-align: center;
            display: none;
            margin: 15px 0;
            font-weight: bold;
            color: var(--primary);
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }

        .countdown-banner {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
            margin: 10px 0;
            min-height: 32px;
        }

        .anim-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .thumbs-up-anim {
            font-size: 7rem;
            animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        .finish-card { text-align: center; padding: 20px 10px; }
        .finish-icon { font-size: 5rem; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="anim-container" class="anim-overlay"></div>

<div class="container">
    <div class="header-bar">
        <h1>📖 Leestrainer</h1>
        <button class="btn-home" onclick="resetApp()">🏠 Home</button>
    </div>

    <!-- STAP 1: FOTO MAKEN & VAKKEN TEKENEN/AANPASSEN -->
    <div id="step-upload" class="step-panel active">
        <label for="camera-input" class="btn">📸 Foto Maken / Kiezen</label>
        <input type="file" id="camera-input" accept="image/*" capture="environment">

        <div class="canvas-container" id="canvas-container">
            <canvas id="image-canvas"></canvas>
        </div>

        <div id="draw-controls" style="display:none;">
            <p style="text-align:center; font-size: 0.9rem; color: #4B5563; margin: 5px 0 10px 0;">
                👉 <strong>Trek een kader</strong> rond een rijtje.<br>
                ✨ <strong>Versleep de bolletjes of zijden</strong> om het kader precies passend te maken.
            </p>
            <button id="process-boxes-btn" class="btn">✂️ Herken Tekst Uit Vakken</button>
            <button id="clear-boxes-btn" class="btn btn-secondary" style="margin-top: 5px;">🗑️ Wis Alle Vakken</button>
        </div>

        <div id="ocr-loader" class="loader">⏳ Tekst wordt herkend...</div>
    </div>

    <!-- STAP 2: TEKST CONTROLEREN -->
    <div id="step-review" class="step-panel">
        <p><strong>Herkende woorden:</strong></p>
        <textarea id="words-input" placeholder="Elk woord op een nieuwe regel..."></textarea>
        <button id="start-practice-btn" class="btn">🚀 Start Leesoefening</button>
    </div>

    <!-- STAP 3: OEFENING -->
    <div id="step-practice" class="step-panel">
        <div class="method-tabs">
            <button class="tab-btn active" id="tab-1" onclick="setMode(1)">VOOR</button>
            <button class="tab-btn" id="tab-2" onclick="setMode(2)">KOOR</button>
            <button class="tab-btn" id="tab-3" onclick="setMode(3)">DOOR</button>
        </div>

        <!-- TEMPO SCHUIFKNOP VOOR VOOR & KOOR -->
        <div class="speed-control" id="speed-control-box">
            <span class="speed-icon">🐢</span>
            <input type="range" id="speed-slider" class="speed-slider" min="0.3" max="0.9" step="0.05" value="0.55">
            <span class="speed-icon">🐇</span>
        </div>

        <!-- WEERGAVE VOOR VOOR & KOOR -->
        <div id="full-list-view">
            <div class="countdown-banner" id="countdown-banner"></div>
            <div class="full-list-card" id="full-list-container"></div>
            <button id="play-list-btn" class="btn" onclick="handleFullListAction()">🔊 Beluister het rijtje</button>
        </div>

        <!-- WEERGAVE VOOR DOOR -->
        <div id="single-word-view" style="display:none;">
            <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #666; margin-bottom: 5px;">
                <span id="progress-text">Woord 1 van 5</span>
            </div>

            <div class="single-word-card" id="target-word">...</div>

            <button id="speak-btn" class="btn" onclick="startListening()">🎤 Druk om te spreken</button>

            <div class="nav-buttons">
                <button class="btn btn-outline" style="margin:0;" onclick="prevWord()">⬅️ Vorige</button>
                <button class="btn btn-outline" style="margin:0;" onclick="nextWord(false)">Volgende ➡️</button>
            </div>
        </div>

        <!-- VISUELE PICTO FEEDBACK -->
        <div id="picto-feedback" class="picto-feedback"></div>
    </div>

    <!-- STAP 4: EINDSCHERM -->
    <div id="step-finished" class="step-panel">
        <div class="finish-card">
            <div class="finish-icon">🏆🌟🎉</div>
            <h2 style="color: var(--primary); margin-top: 0;">Super gedaan!</h2>
            <div style="margin-top: 25px;">
                <button class="btn" onclick="setMode(1); switchStep('step-practice');">🔄 Rijtje nog eens oefenen</button>
                <button class="btn btn-secondary" onclick="resetApp()">📸 Nieuwe foto maken</button>
            </div>
        </div>
    </div>
</div>

<script>
    // GLOBALE VARIABELEN
    let loadedImage = null;
    let canvas = document.getElementById('image-canvas');
    let ctx = canvas.getContext('2d');
    
    let boxes = []; // [{x, y, w, h}]
    let isDrawing = false;
    let dragState = null; // { boxIndex, handle, startPos, initialBox }
    let startX, startY, currentX, currentY;

    const HANDLE_RADIUS = 16; // Aanraakgevoelige zone rondom de bolletjes/zijden

    let wordList = [];
    let currentIndex = 0;
    let currentMode = 1;
    let recognition = null;
    let isPlayingList = false;
    let errorCount = 0;

    const cameraInput = document.getElementById('camera-input');
    const canvasContainer = document.getElementById('canvas-container');
    const drawControls = document.getElementById('draw-controls');
    const ocrLoader = document.getElementById('ocr-loader');
    const wordsInput = document.getElementById('words-input');

    // 1. VLAAMSE SPRAAKUITVOER (TTS)
    function speakText(text, onEndCallback = null) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        const speedVal = parseFloat(document.getElementById('speed-slider').value);
        utterance.rate = speedVal;
        utterance.lang = 'nl-BE';

        const voices = window.speechSynthesis.getVoices();
        const flemishVoice = voices.find(v => 
            v.lang === 'nl-BE' || 
            v.lang.includes('BE') || 
            (v.lang.includes('nl') && (v.name.toLowerCase().includes('belgium') || v.name.toLowerCase().includes('flemish') || v.name.toLowerCase().includes('ellen')))
        );

        if (flemishVoice) utterance.voice = flemishVoice;
        if (onEndCallback) utterance.onend = onEndCallback;

        window.speechSynthesis.speak(utterance);
    }

    // 2. CANVAS INTERACTIE: TEKENS, BIJSNIJDEN & AANPASSEN
    cameraInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            loadedImage = new Image();
            loadedImage.onload = () => {
                setupCanvas();
                canvasContainer.style.display = 'block';
                drawControls.style.display = 'block';
            };
            loadedImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function setupCanvas() {
        boxes = [];
        const containerWidth = canvasContainer.clientWidth || 460;
        const scale = containerWidth / loadedImage.width;
        
        canvas.width = containerWidth;
        canvas.height = loadedImage.height * scale;

        redrawCanvas();
    }

    function redrawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);

        // Teken alle kaders
        boxes.forEach((box, index) => {
            // Rechthoek
            ctx.strokeStyle = '#4F46E5';
            ctx.lineWidth = 3;
            ctx.strokeRect(box.x, box.y, box.w, box.h);

            ctx.fillStyle = 'rgba(79, 70, 229, 0.15)';
            ctx.fillRect(box.x, box.y, box.w, box.h);

            // Nummer van het vak
            ctx.fillStyle = '#4F46E5';
            ctx.fillRect(box.x, box.y, 26, 26);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 15px sans-serif';
            ctx.fillText((index + 1).toString(), box.x + 8, box.y + 18);

            // Teken 8 Aanrijpingspunten (bolletjes) op hoeken & zijden
            drawHandles(box);
        });

        // Teken het vak dat momenteel getekend wordt
        if (isDrawing) {
            ctx.strokeStyle = '#10B981';
            ctx.lineWidth = 2;
            const w = currentX - startX;
            const h = currentY - startY;
            ctx.strokeRect(startX, startY, w, h);
        }
    }

    function drawHandles(box) {
        const { x, y, w, h } = box;
        const handles = [
            { x: x, y: y },                 // nw
            { x: x + w / 2, y: y },         // n
            { x: x + w, y: y },             // ne
            { x: x + w, y: y + h / 2 },     // e
            { x: x + w, y: y + h },         // se
            { x: x + w / 2, y: y + h },     // s
            { x: x, y: y + h },             // sw
            { x: x, y: y + h / 2 }          // w
        ];

        handles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 7, 0, 2 * Math.PI);
            ctx.fillStyle = '#FFFFFF';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#4F46E5';
            ctx.stroke();
        });
    }

    // Controleer of de gebruiker op een bolletje, zijde of in een vak tikt
    function getHandleAt(pos) {
        for (let i = boxes.length - 1; i >= 0; i--) {
            const b = boxes[i];
            const { x, y, w, h } = b;

            const handles = [
                { name: 'nw', x: x, y: y },
                { name: 'ne', x: x + w, y: y },
                { name: 'sw', x: x, y: y + h },
                { name: 'se', x: x + w, y: y + h },
                { name: 'n',  x: x + w / 2, y: y },
                { name: 's',  x: x + w / 2, y: y + h },
                { name: 'w',  x: x, y: y + h / 2 },
                { name: 'e',  x: x + w, y: y + h / 2 }
            ];

            // 1. Controleer bolletjes
            for (let hnd of handles) {
                const dist = Math.hypot(pos.x - hnd.x, pos.y - hnd.y);
                if (dist <= HANDLE_RADIUS) {
                    return { boxIndex: i, handle: hnd.name };
                }
            }

            // 2. Controleer verslepen van het hele vak
            if (pos.x >= x && pos.x <= x + w && pos.y >= y && pos.y <= y + h) {
                return { boxIndex: i, handle: 'move' };
            }
        }
        return null;
    }

    function getCanvasCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function handleStart(e) {
        const pos = getCanvasCoordinates(e);
        const hit = getHandleAt(pos);

        if (hit) {
            dragState = {
                boxIndex: hit.boxIndex,
                handle: hit.handle,
                startPos: pos,
                initialBox: { ...boxes[hit.boxIndex] }
            };
        } else {
            isDrawing = true;
            startX = pos.x;
            startY = pos.y;
            currentX = pos.x;
            currentY = pos.y;
        }
    }

    function handleMove(e) {
        const pos = getCanvasCoordinates(e);

        if (dragState) {
            const dx = pos.x - dragState.startPos.x;
            const dy = pos.y - dragState.startPos.y;
            const b = boxes[dragState.boxIndex];
            const init = dragState.initialBox;

            switch (dragState.handle) {
                case 'nw': b.x = init.x + dx; b.w = init.w - dx; b.y = init.y + dy; b.h = init.h - dy; break;
                case 'ne': b.w = init.w + dx; b.y = init.y + dy; b.h = init.h - dy; break;
                case 'sw': b.x = init.x + dx; b.w = init.w - dx; b.h = init.h + dy; break;
                case 'se': b.w = init.w + dx; b.h = init.h + dy; break;
                case 'n':  b.y = init.y + dy; b.h = init.h - dy; break;
                case 's':  b.h = init.h + dy; break;
                case 'w':  b.x = init.x + dx; b.w = init.w - dx; break;
                case 'e':  b.w = init.w + dx; break;
                case 'move': b.x = init.x + dx; b.y = init.y + dy; break;
            }
            redrawCanvas();
        } else if (isDrawing) {
            currentX = pos.x;
            currentY = pos.y;
            redrawCanvas();
        }
    }

    function handleEnd() {
        if (dragState) {
            // Zorg ervoor dat breedte/hoogte positief blijven na verslepen
            const b = boxes[dragState.boxIndex];
            if (b.w < 0) { b.x += b.w; b.w = Math.abs(b.w); }
            if (b.h < 0) { b.y += b.h; b.h = Math.abs(b.h); }
            dragState = null;
            redrawCanvas();
        } else if (isDrawing) {
            isDrawing = false;
            let w = currentX - startX;
            let h = currentY - startY;
            let x = startX;
            let y = startY;

            if (w < 0) { x = currentX; w = Math.abs(w); }
            if (h < 0) { y = currentY; h = Math.abs(h); }

            if (w > 20 && h > 20) {
                boxes.push({ x, y, w, h });
            }
            redrawCanvas();
        }
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', (e) => { handleStart(e); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { handleMove(e); e.preventDefault(); });
    canvas.addEventListener('touchend', handleEnd);

    document.getElementById('clear-boxes-btn').addEventListener('click', () => {
        boxes = [];
        redrawCanvas();
    });

    // 3. OCR OP ELK GESELECTEERD VAK
    document.getElementById('process-boxes-btn').addEventListener('click', async () => {
        if (boxes.length === 0) {
            alert("Trek eerst minstens één kader rond een woordrijtje op de foto.");
            return;
        }

        canvasContainer.style.display = 'none';
        drawControls.style.display = 'none';
        ocrLoader.style.display = 'block';

        let allRecognizedWords = [];

        const scaleX = loadedImage.width / canvas.width;
        const scaleY = loadedImage.height / canvas.height;

        for (let i = 0; i < boxes.length; i++) {
            const box = boxes[i];
            
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');

            const realX = box.x * scaleX;
            const realY = box.y * scaleY;
            const realW = box.w * scaleX;
            const realH = box.h * scaleY;

            tempCanvas.width = realW;
            tempCanvas.height = realH;

            tempCtx.drawImage(loadedImage, realX, realY, realW, realH, 0, 0, realW, realH);

            try {
                const result = await Tesseract.recognize(tempCanvas, 'nld');
                const rawText = result.data.text;
                const lines = rawText.split('\n');

                lines.forEach(line => {
                    const clean = line.replace(/[^a-zA-ZáéíóúäëïöüÅå-]/g, "").trim();
                    if (clean.length > 0) {
                        allRecognizedWords.push(clean);
                    }
                });
            } catch (err) {
                console.error("OCR fout in vak " + (i + 1), err);
            }
        }

        ocrLoader.style.display = 'none';
        wordsInput.value = allRecognizedWords.join('\n');
        switchStep('step-review');
    });

    // 4. SPRAAKHERKENNING
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'nl-BE';
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const spokenWord = event.results[0][0].transcript.toLowerCase().trim();
            evaluateSpeech(spokenWord);
        };

        recognition.onerror = () => {
            showPictoFeedback('👂');
            document.getElementById('speak-btn').innerText = "🎤 Druk om te spreken";
        };
    }

    function evaluateSpeech(spoken) {
        const target = wordList[currentIndex].toLowerCase().trim();
        
        if (spoken === target) {
            errorCount = 0;
            showPictoFeedback('🌟');
            triggerRandomAnimation();
            
            setTimeout(() => {
                if (currentMode === 3) {
                    if (currentIndex < wordList.length - 1) {
                        nextWord(true);
                    } else {
                        showCompletionView();
                    }
                }
            }, 1200);
        } else {
            errorCount++;
            
            if (errorCount >= 2) {
                showPictoFeedback('💡');
                
                speakText(wordList[currentIndex], () => {
                    setTimeout(() => {
                        if (currentIndex < wordList.length - 1) {
                            nextWord(true);
                        } else {
                            showCompletionView();
                        }
                    }, 600);
                });
                errorCount = 0;
            } else {
                showPictoFeedback('👂');
                speakText("Bijna! Probeer nog eens.", () => {
                    document.getElementById('speak-btn').innerText = "🎤 Druk om te spreken";
                });
            }
        }
    }

    // 5. STAP & MODUS NAVIGATIE
    document.getElementById('start-practice-btn').addEventListener('click', () => {
        const rawText = wordsInput.value.trim();
        if (!rawText) return;
        wordList = rawText.split('\n').map(w => w.trim()).filter(w => w.length > 0);
        currentIndex = 0;
        switchStep('step-practice');
        renderFullList();
        setMode(1);
    });

    function renderFullList() {
        const container = document.getElementById('full-list-container');
        container.innerHTML = '';
        wordList.forEach((word, idx) => {
            const badge = document.createElement('div');
            badge.className = 'word-badge';
            badge.id = `badge-${idx}`;
            badge.innerText = word;
            container.appendChild(badge);
        });
    }

    function setMode(mode) {
        currentMode = mode;
        stopSpeechAndTimers();

        document.querySelectorAll('.tab-btn').forEach((tab, i) => {
            tab.classList.toggle('active', i + 1 === mode);
        });

        const fullListView = document.getElementById('full-list-view');
        const singleWordView = document.getElementById('single-word-view');
        const speedControl = document.getElementById('speed-control-box');
        const playListBtn = document.getElementById('play-list-btn');

        showPictoFeedback('');

        if (mode === 1 || mode === 2) {
            fullListView.style.display = 'block';
            singleWordView.style.display = 'none';
            speedControl.style.display = 'flex';
            playListBtn.innerText = mode === 1 ? "🔊 Beluister het rijtje" : "🗣️ Nu samen lezen";
        } 
        else if (mode === 3) {
            fullListView.style.display = 'none';
            singleWordView.style.display = 'block';
            speedControl.style.display = 'none';
            currentIndex = 0;
            errorCount = 0;
            updateSingleWordUI();
        }
    }

    function handleFullListAction() {
        if (isPlayingList) {
            stopSpeechAndTimers();
            return;
        }

        if (currentMode === 1) {
            readFullListSequentially();
        } else if (currentMode === 2) {
            const banner = document.getElementById('countdown-banner');
            let count = 3;
            banner.innerText = `⏳ Samen lezen in ${count}...`;
            
            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    banner.innerText = `⏳ Samen lezen in ${count}...`;
                } else {
                    clearInterval(timer);
                    banner.innerText = "🗣️ Nu samen lezen!";
                    readFullListSequentially();
                }
            }, 800);
        }
    }

    function readFullListSequentially() {
        stopSpeechAndTimers();
        isPlayingList = true;

        const playBtn = document.getElementById('play-list-btn');
        playBtn.innerText = "⏹️ Stop";
        playBtn.className = "btn btn-secondary";

        let index = 0;

        function speakNext() {
            if (index >= wordList.length || !isPlayingList) {
                stopSpeechAndTimers();
                showPictoFeedback('🌟');
                triggerRandomAnimation();
                return;
            }

            clearWordHighlights();
            const badge = document.getElementById(`badge-${index}`);
            if (badge) badge.classList.add('active-word');

            speakText(wordList[index], () => {
                index++;
                setTimeout(speakNext, 500);
            });
        }

        speakNext();
    }

    function clearWordHighlights() {
        document.querySelectorAll('.word-badge').forEach(b => b.classList.remove('active-word'));
    }

    function stopSpeechAndTimers() {
        isPlayingList = false;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        clearWordHighlights();
        document.getElementById('countdown-banner').innerText = '';
        
        const playBtn = document.getElementById('play-list-btn');
        if (playBtn) {
            playBtn.className = "btn";
            playBtn.innerText = currentMode === 1 ? "🔊 Beluister het rijtje" : "🗣️ Nu samen lezen";
        }
    }

    function updateSingleWordUI() {
        document.getElementById('target-word').innerText = wordList[currentIndex];
        document.getElementById('progress-text').innerText = `Woord ${currentIndex + 1} van ${wordList.length}`;
        document.getElementById('speak-btn').innerText = "🎤 Druk om te spreken";
        showPictoFeedback('');
    }

    function startListening() {
        showPictoFeedback('');
        if (!recognition) {
            alert("Spraakherkenning wordt niet ondersteund op deze browser.");
            return;
        }
        document.getElementById('speak-btn').innerText = "🎙️ Aan het luisteren...";
        try { recognition.start(); } catch(e) { recognition.stop(); recognition.start(); }
    }

    function showPictoFeedback(emoji) {
        document.getElementById('picto-feedback').innerText = emoji;
    }

    function triggerRandomAnimation() {
        const choice = Math.floor(Math.random() * 3);
        if (choice === 0) confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
        else if (choice === 1) showOverlayEmoji('👍');
        else if (choice === 2) showOverlayEmoji('🌟');
    }

    function showOverlayEmoji(emoji) {
        const container = document.getElementById('anim-container');
        const el = document.createElement('div');
        el.className = 'thumbs-up-anim';
        el.innerText = emoji;
        container.appendChild(el);
        setTimeout(() => el.remove(), 1200);
    }

    function nextWord(autoListen = false) {
        if (currentIndex < wordList.length - 1) {
            currentIndex++;
            errorCount = 0;
            updateSingleWordUI();
            if (autoListen) setTimeout(() => startListening(), 400);
        }
    }

    function prevWord() {
        if (currentIndex > 0) {
            currentIndex--;
            errorCount = 0;
            updateSingleWordUI();
        }
    }

    function showCompletionView() {
        stopSpeechAndTimers();
        switchStep('step-finished');
        confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
    }

    function switchStep(stepId) {
        document.querySelectorAll('.step-panel').forEach(panel => panel.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    function resetApp() {
        stopSpeechAndTimers();
        location.reload();
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }
</script>

</body>
</html>
